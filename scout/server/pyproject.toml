[project]
name = "confluo-scout"
version = "0.1.0"
description = "Confluo Scout: a local, single-user search service for AI conference and journal papers"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary (Orbit Labs)" }
dependencies = [
  "fastapi>=0.164",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28.1",
  "pydantic>=2.14",
  "pyyaml>=6.0.3",
  "lxml>=6.1",
  "zstandard>=0.25",
  "numpy>=2.5",
  "rapidfuzz>=3.14",
  "PyStemmer>=3.1",
  "qdrant-client>=1.20",
  "google-genai>=3.5",
  "sentence-transformers>=6.3",
  "transformers>=5.23",
  "torch>=2.14,<2.15",
  # EmbeddingGemma 2 builds its multimodal processor even for text-only use
  "pillow>=11",
  "torchvision>=0.29,<0.30",
]

[project.scripts]
scout = "confluo_scout.cli:main"

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confluo_scout"]

# torch: CPU-only wheels inside the Linux container; the default PyPI wheel (with MPS) on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Chinese text in strings and comments uses full-width punctuation on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
