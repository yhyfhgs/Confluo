# Confluo Scout: local AI-venue paper search.
#   make up      build and start (web UI at http://127.0.0.1:8770)
# Data lives in ../.confluo/scout (override with SCOUT_DATA); secrets come read-only from
# ../.confluo/config.toml (override with SCOUT_SECRETS). The live SQLite database and Qdrant's
# storage are named volumes inside the VM: a host process that opens a WAL database through the
# virtiofs mount can corrupt it (it happened on 2026-11-19), and Qdrant flags FUSE mounts as
# unsafe. Consistent copies land in the data directory: database backups every 6 hours and on
# stop (db/backups/), Qdrant snapshots daily (qdrant/snapshots/). An empty volume is restored
# from the newest copy on start.
name: confluo-scout

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "128"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ${SCOUT_DATA:-../.confluo/scout}/qdrant/snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  scout:
    build:
      context: .
      dockerfile: Dockerfile
    image: confluo-scout:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8770:8000"
    stop_grace_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SCOUT_DATA: /data
      SCOUT_DB_PATH: /var/lib/scout/scout.sqlite
      # Optional accelerator on the host (make embed-serve); without it the container embeds on CPU.
      SCOUT_EMBED_URL: http://host.docker.internal:8790
      SCOUT_SECRETS: /secrets/config.toml
      SCOUT_REGISTRY: /app/registry/venues.yaml
      SCOUT_WEB_DIST: /app/web/dist
      QDRANT_URL: http://qdrant:6333
      SCOUT_DEVICE: cpu
      SCOUT_TORCH_THREADS: "8"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - scout-db:/var/lib/scout
      - ${SCOUT_DATA:-../.confluo/scout}:/data
      - ${SCOUT_SECRETS:-../.confluo/config.toml}:/secrets/config.toml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  qdrant-storage:
  scout-db:
