[project]
name = "paper-crawler"
version = "0.1.0"
description = "可插拔式学术论文获取系统（个人科研用）—— 核心框架"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "python-ulid>=2",
    "httpx>=0.28.1",
]

[project.scripts]
crawler = "paper_crawler.cli:main"

# 内置 adapter 通过 entry point 组注册（design/02 §4）。第三方 pip 包声明同名组即可被发现。
# stubs（crossref/elsevier_sd）由 load_adapters() 内置注册，不走 entry point（包内占位）。
[project.entry-points."paper_crawler.adapters"]
mock_platform = "paper_crawler.adapters.mock_platform:MockPlatformAdapter"
arxiv = "paper_crawler.adapters.arxiv.adapter:ArxivAdapter"
crossref = "paper_crawler.adapters.crossref.adapter:CrossrefAdapter"
openreview = "paper_crawler.adapters.openreview.adapter:OpenReviewAdapter"
pmlr = "paper_crawler.adapters.pmlr.adapter:PmlrAdapter"
acl_anthology = "paper_crawler.adapters.acl_anthology.adapter:AclAnthologyAdapter"
cvf = "paper_crawler.adapters.cvf.adapter:CVFAdapter"
aaai_ojs = "paper_crawler.adapters.aaai_ojs.adapter:AaaiOjsAdapter"
neurips_proceedings = "paper_crawler.adapters.neurips_proceedings.adapter:NeuripsProceedingsAdapter"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_crawler"]

[tool.ruff]
extend-exclude = [".claude"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m 'not online'`：T5 在线冒烟默认零真实网络（AGENTS §6/test-plan §9）——
# `tests/online/` 下 `online` 标记的用例默认被排除，显式 `pytest -m online`
# 才会跑；命令行再给的 `-m` 会覆盖这里的默认值（pytest 标准 addopts 语义）。
addopts = "--strict-markers -m 'not online'"
markers = [
    "slow: 慢测试（kill-9 等，Phase 1 T9 引入）",
    "online: 需要真实网络的在线冒烟测试（T5）；默认经 addopts 排除，显式 `-m online` 才跑（Phase 2 T3 引入，见 tests/online/ 与 docs/testing/test-plan.md §9）",
]

[tool.coverage.run]
branch = true
source = ["paper_crawler"]

[tool.coverage.report]
exclude_also = [
    '^\s*\.\.\.\s*$',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
