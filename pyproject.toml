[project]
name = "paper-crawler"
version = "0.1.0"
description = "可插拔式学术论文获取系统（个人科研用）—— 核心框架"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "python-ulid>=2",
    "httpx>=0.28.1",
]

[project.scripts]
crawler = "paper_crawler.cli:main"

# Phase 4 认证域可选依赖（auth-framework §10，D-023）：核心 dependencies 不含加密/浏览器件；
# 本 T1a 仅声明——auth/store.py（T1b）/auth/browser.py（T1b）惰性 import，默认安装与默认
# `make check` 零触碰。CI 标准环境装 `[auth]`（uv sync --extra auth，B-m7）；`[auth-browser]`
# 重（含浏览器二进制），靠 PC_BROWSER_TESTS 手动门，不进默认 CI。
[project.optional-dependencies]
auth = ["cryptography>=42", "keyring>=24"]          # 凭证库：AES-GCM + 主密钥存储（§3.2/3.3）
auth-browser = ["playwright>=1.40"]                 # 首登 headed / 浏览器上下文下载（§9）

# 内置 adapter 通过 entry point 组注册（design/02 §4）。第三方 pip 包声明同名组即可被发现。
# 全部 16 个内置 adapter 均走 entry point——Phase 3/4 stub 已全部退役（crossref P3-T3、
# elsevier_sd P4-T3 由包内占位 stub 转真实 entry point，stubs.py 已删）。
[project.entry-points."paper_crawler.adapters"]
mock_platform = "paper_crawler.adapters.mock_platform:MockPlatformAdapter"
arxiv = "paper_crawler.adapters.arxiv.adapter:ArxivAdapter"
crossref = "paper_crawler.adapters.crossref.adapter:CrossrefAdapter"
openreview = "paper_crawler.adapters.openreview.adapter:OpenReviewAdapter"
pmlr = "paper_crawler.adapters.pmlr.adapter:PmlrAdapter"
acl_anthology = "paper_crawler.adapters.acl_anthology.adapter:AclAnthologyAdapter"
cvf = "paper_crawler.adapters.cvf.adapter:CVFAdapter"
aaai_ojs = "paper_crawler.adapters.aaai_ojs.adapter:AaaiOjsAdapter"
neurips_proceedings = "paper_crawler.adapters.neurips_proceedings.adapter:NeuripsProceedingsAdapter"
unpaywall = "paper_crawler.adapters.unpaywall.adapter:UnpaywallAdapter"
dblp = "paper_crawler.adapters.dblp.adapter:DblpAdapter"
# Phase 4 T-wiley（auth_gated；RESOLVE|FETCH，TDM API + token 门控 skip，D-024）。
wiley = "paper_crawler.adapters.wiley.adapter:WileyAdapter"
# Phase 4 T3：elsevier_sd（auth_gated/官方 API 档；RESOLVE|FETCH，enumerate 走 crossref，D-005）。
elsevier_sd = "paper_crawler.adapters.elsevier_sd.adapter:ElsevierScienceDirectAdapter"
# Phase 4 T4：OUP Silverchair 平台（auth_gated，RESOLVE|FETCH；QJE 等经济金融顶刊全文取回）。
oup_silverchair = "paper_crawler.adapters.oup_silverchair.adapter:OupSilverchairAdapter"
# T6：enrich 通道（capabilities 空集，无 ENUMERATE/SEARCH/FETCH/RESOLVE，不参与 pull）。
openalex = "paper_crawler.adapters.openalex.adapter:OpenAlexAdapter"
s2 = "paper_crawler.adapters.s2.adapter:S2Adapter"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_crawler"]

[tool.ruff]
extend-exclude = [".claude"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m 'not online'`：T5 在线冒烟默认零真实网络（AGENTS §6/test-plan §9）——
# `tests/online/` 下 `online` 标记的用例默认被排除，显式 `pytest -m online`
# 才会跑；命令行再给的 `-m` 会覆盖这里的默认值（pytest 标准 addopts 语义）。
addopts = "--strict-markers -m 'not online'"
markers = [
    "slow: 慢测试（kill-9 等，Phase 1 T9 引入）",
    "online: 需要真实网络的在线冒烟测试（T5）；默认经 addopts 排除，显式 `-m online` 才跑（Phase 2 T3 引入，见 tests/online/ 与 docs/testing/test-plan.md §9）",
]

[tool.coverage.run]
branch = true
source = ["paper_crawler"]

[tool.coverage.report]
exclude_also = [
    '^\s*\.\.\.\s*$',
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
