# venues/econ/jep.yaml —— Journal of Economic Perspectives（Phase 5 T5；design/adapters/aea.md §7）
id: jep
kind: journal
names:
  full: Journal of Economic Perspectives
  aliases: [JEP]
field: [econ]
tier: T2                      # catalog/economics-journals.md AEA 系列
identifiers:
  issn: ["0895-3309"]         # 期刊必填（D-015）；ISSN 出处 [LIVE] 2026-07-24 站点勘察实证
                               # （crossref /journals/0895-3309/works total-results=2330；
                               # unpaywall 10.1257/jep.20251473 → is_oa=true oa_status=gold）
metadata_source: crossref
fulltext_source: aea
auth:
  level: none                 # JEP = gold OA 全刊免费（unpaywall [LIVE] 实证 journal_is_oa=True）
  provider_hint: aea
quirks:
  ai_bot_sensitive: true       # robots.txt 点名封 GPTBot/Amazonbot（aea.md §2/site-survey §1）
  doi_forms: [submission, vol_issue_page, pnp]  # aea.md §7 字段设计；解析器 parse.parse_doi
status: active
notes: >
  DOI code=jep（10.1257/jep.{suffix}）。季刊，全刊 gold OA（unpaywall [LIVE] 实证：
  is_oa=true / oa_status=gold / best_oa_location.host_type=publisher）。**反直觉发现
  （aea.md §3.4）**：即便"gold OA"，best_oa 副本的宿主仍是 pubs.aeaweb.org——同一
  Cloudflare BLOCKED 域（站点勘察 [LIVE]：HEAD /doi/pdfplus/{JEP DOI} → HTTP/2 403
  + cf-mitigated: challenge + 5672B 挑战体）。故本 Phase resolve 离线判定同样不产
  可 stateless-fetch 的计划（仅记 deferred 全文 URL 观测，供未来 browser-fetch 通道
  消费），不 raise no_entitlement（无认证问题，auth.level=none 属实）——OA-fallback
  （unpaywall）对本刊虽报 gold，实质仍不可 stateless 取（best_oa 落 CF 域），实现期
  不应把 unpaywall 当 AEA 全文主路（aea.md §10 风险条）。
