notes: >
  元数据经 Crossref 按 ISSN 枚举全史 DOI 清单（D-005，metadata_source 分离）。全文平台为
  Oxford University Press（Silverchair 系）：Phase 4 T4 落地 `oup_silverchair` adapter
  并经 entry point 注册后，fulltext_source 已由 Phase 3 的 `elsevier_sd` 占位**收敛为
