# venues/cs_ai/aaai.yaml —— AAAI Conference on Artificial Intelligence
#
# 覆盖 ojs.aaai.org OAI 实例已确认收录的 2010+ 各届（Vol.24=AAAI-2010 … Vol.40=AAAI-26；
# 全库 OAI 收割 [LIVE 2026-07-23] 实测取回 Vol.24–32/2010–2018 共 5049 条活记录，同构
# 可收割，controller 2026-07-24 裁决扩容纳入，见 docs/design/adapters/aaai-ojs.md §10 ★F）；
# 更早届（1980s–2009）未被 100% 穷尽排除但证据倾向不在本 OJS 实例，仍为界外，由其他
# 数据源/adapter 负责（D-012 DBLP conf/aaai + Wayback），见 docs/design/adapters/aaai-ojs.md §3.1。
# volume_map 取线性关系 Vol=年份−1986（[LIVE] 2019–2026 段原 2 锚点+推断中间年；
# 2010–2018 段 2026-07-23 全库收割逐届实测验证、非推断）；D-019 完整性锚点见
# tests/fixtures/aaai/dblp-aaai-anchor.json。
id: aaai
kind: conference
names: {full: AAAI Conference on Artificial Intelligence, aliases: [AAAI]}
field: [cs_ai]
tier: T1
identifiers:
  dblp_key: conf/aaai
metadata_source: aaai_ojs
fulltext_source: aaai_ojs
auth: {level: none}
quirks:
  # 届/年聚合 Issue（design §3.2 方案 B）：一届=一卷=一 IssueRef，幂等键 (venue, year)。
  volume_map: {2010: 24, 2011: 25, 2012: 26, 2013: 27, 2014: 28, 2015: 29, 2016: 30, 2017: 31, 2018: 32, 2019: 33, 2020: 34, 2021: 35, 2022: 36, 2023: 37, 2024: 38, 2025: 39, 2026: 40}
  # OJS journal context 代码（OAI baseURL /index.php/{ojs_code}/oai）；缺省即 venue.id.upper()。
  ojs_code: AAAI
status: active
notes: >-
  AAAI OJS 实例（ojs.aaai.org）主抓取走 OAI-PMH oai_dc（REST API 匿名 403 不可用）；
  单届被拆成多个 OJS issue（AAAI-26 达 48 个 "No.M"），"No.M" 降为 per-paper meta 非
  IssueRef 维度。identifier 产本源 DOI（10.1609/aaai.v{V}i{I}.{articleId}，小写规范）。
  免费只读镜像/个人科研用途、不再分发（非 CC-BY 开放许可），见 docs/design/adapters/aaai-ojs.md。
