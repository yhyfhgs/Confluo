<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Paper Crawler · 双状态机 · 对应 docs/process/status-workflow.md · 2026-07-20 -->
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="700" fill="#fafbfc"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#263238">双状态机与联动门禁（D-010）：文档先行的机器可判形态</text>
  <text x="40" y="64" font-size="12" fill="#78909c">对应 process/status-workflow.md · 2026-07-20</text>

  <!-- ===== 文档状态机 ===== -->
  <g>
    <rect x="40" y="88" width="1080" height="190" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
    <text x="56" y="114" font-size="15" font-weight="bold" fill="#1565c0">文档状态机（docs/**/*.md 的 front matter status）</text>
    <rect x="70" y="140" width="130" height="46" rx="23" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="135" y="168" font-size="14" text-anchor="middle" fill="#455a64">draft</text>
    <rect x="290" y="140" width="130" height="46" rx="23" fill="#fff8e1" stroke="#ffb300" stroke-width="1.5"/>
    <text x="355" y="168" font-size="14" text-anchor="middle" fill="#e65100">review</text>
    <rect x="510" y="140" width="150" height="46" rx="23" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
    <text x="585" y="168" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">approved</text>
    <rect x="750" y="140" width="150" height="46" rx="23" fill="#c8e6c9" stroke="#388e3c" stroke-width="1.5"/>
    <text x="825" y="168" font-size="14" text-anchor="middle" fill="#1b5e20">implemented</text>
    <rect x="970" y="140" width="130" height="46" rx="23" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="1035" y="168" font-size="14" text-anchor="middle" fill="#78909c">deprecated</text>
    <g stroke="#546e7a" stroke-width="1.8" fill="none">
      <line x1="200" y1="163" x2="290" y2="163" marker-end="url(#s)"/>
      <line x1="420" y1="163" x2="510" y2="163" marker-end="url(#s)"/>
      <line x1="660" y1="163" x2="750" y2="163" marker-end="url(#s)"/>
      <line x1="900" y1="163" x2="970" y2="163" marker-end="url(#s)"/>
    </g>
    <text x="245" y="152" font-size="10.8" text-anchor="middle" fill="#607d8b">自审过·无占位符</text>
    <text x="465" y="152" font-size="10.8" text-anchor="middle" fill="#607d8b">评审通过</text>
    <text x="705" y="152" font-size="10.8" text-anchor="middle" fill="#607d8b">关联模块 stable</text>
    <text x="935" y="152" font-size="10.8" text-anchor="middle" fill="#607d8b">被替代</text>
    <g stroke="#c62828" stroke-width="1.5" fill="none">
      <path d="M 355 186 C 355 226 220 226 160 186" marker-end="url(#sr)"/>
      <path d="M 585 186 C 545 226 430 216 390 186" marker-end="url(#sr)"/>
    </g>
    <text x="250" y="238" font-size="10.8" fill="#c62828">重大返工回 draft</text>
    <text x="452" y="228" font-size="10.8" fill="#c62828">实质修改降回 review（或走 ADR）</text>
    <text x="700" y="256" font-size="11.5" fill="#455a64">评审自查清单：无占位符 · 内部一致 · FR/AC/D 编号有效 · 五要素齐 · 事实有来源</text>
  </g>

  <!-- ===== 联动 ===== -->
  <g>
    <rect x="330" y="300" width="500 " height="96" rx="8" fill="#fff5f5" stroke="#e57373" stroke-width="1.6"/>
    <text x="580" y="326" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">联动门禁（双状态机耦合点）</text>
    <text x="580" y="350" font-size="12" text-anchor="middle" fill="#455a64">① 模块 in_dev 前置 = 文档 approved（硬门禁）　② 模块 stable → 文档 implemented</text>
    <text x="580" y="372" font-size="12" text-anchor="middle" fill="#455a64">③ implemented 文档实质修改 → 模块打回 testing　④ canary 连续 2 周失败 → 模块降 testing</text>
    <g stroke="#1565c0" stroke-width="1.8" fill="none" stroke-dasharray="6,4">
      <line x1="585" y1="186" x2="480 " y2="300" marker-end="url(#sb)"/>
      <line x1="680" y1="396" x2="680" y2="470" marker-end="url(#sb)"/>
      <path d="M 825 186 C 825 240 830 270 830 300" marker-end="url(#sb)"/>
    </g>
  </g>

  <!-- ===== 模块状态机 ===== -->
  <g>
    <rect x="40" y="472" width="1080" height="160" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
    <text x="56" y="498" font-size="15" font-weight="bold" fill="#2e7d32">代码模块状态机（实现阶段生效；adapter / core 模块粒度）</text>
    <rect x="60" y="524" width="120" height="46" rx="23" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/>
    <text x="120" y="552" font-size="13.5" text-anchor="middle" fill="#455a64">planned</text>
    <rect x="230" y="524" width="150" height="46" rx="23" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
    <text x="305" y="552" font-size="13.5" text-anchor="middle" fill="#0d47a1">spec_approved</text>
    <rect x="430" y="524" width="120" height="46" rx="23" fill="#fff8e1" stroke="#ffb300" stroke-width="1.5"/>
    <text x="490" y="552" font-size="13.5" text-anchor="middle" fill="#e65100">in_dev</text>
    <rect x="600" y="524" width="120" height="46" rx="23" fill="#fff8e1" stroke="#ffb300" stroke-width="1.5"/>
    <text x="660" y="552" font-size="13.5" text-anchor="middle" fill="#e65100">testing</text>
    <rect x="770" y="524" width="120" height="46" rx="23" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
    <text x="830" y="552" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">stable</text>
    <rect x="940" y="524" width="140" height="46" rx="23" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="1010" y="552" font-size="13.5" text-anchor="middle" fill="#78909c">deprecated</text>
    <g stroke="#546e7a" stroke-width="1.8" fill="none">
      <line x1="180" y1="547" x2="230" y2="547" marker-end="url(#s)"/>
      <line x1="380" y1="547" x2="430" y2="547" marker-end="url(#s)"/>
      <line x1="550" y1="547" x2="600" y2="547" marker-end="url(#s)"/>
      <line x1="720" y1="547" x2="770" y2="547" marker-end="url(#s)"/>
      <line x1="890" y1="547" x2="940" y2="547" marker-end="url(#s)"/>
    </g>
    <g stroke="#c62828" stroke-width="1.5" fill="none">
      <path d="M 660 570 C 620 610 380 610 320 570" marker-end="url(#sr)"/>
    </g>
    <text x="205" y="540" font-size="10.5" fill="#607d8b">文档=approved</text>
    <text x="392" y="540" font-size="10.5" fill="#607d8b">建分支</text>
    <text x="560" y="540" font-size="10.5" fill="#607d8b">单测过</text>
    <text x="726" y="540" font-size="10.5" fill="#607d8b">AC 全过</text>
    <text x="430" y="618" font-size="10.8" fill="#c62828">设计实质变更 / canary 连败 → 打回</text>
    <text x="770" y="600" font-size="11" fill="#455a64">stable 判据：AC 留痕 records/ + canary 注册</text>
  </g>

  <!-- 底注 -->
  <text x="40" y="664" font-size="12" fill="#78909c">状态记录位置：文档状态在各文件 front matter（INDEX.md 汇总视图）；模块状态在 progress.md 模块表 + catalog 各 venue 行（supported_since / ⚠ 漂移批注）。</text>
  <text x="40" y="684" font-size="12" fill="#78909c">流转留痕：随所在 git 提交 message 体现（例：docs(design): promote 05-pipeline to approved）——不单独记日志。</text>
</svg>
