<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="880" viewBox="0 0 1160 880" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Paper Crawler · 可插拔框架两层结构 · 对应 docs/design/02-plugin-framework.md · 2026-07-20 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="880" fill="#fafbfc"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#263238">可插拔框架：VenueSpec（声明）× PlatformAdapter（代码）</text>
  <text x="40" y="64" font-size="12" fill="#78909c">对应 design/02-plugin-framework.md · D-002/D-003/D-005 · 2026-07-20</text>

  <!-- ===== 第二层：VenueSpec YAML ===== -->
  <g>
    <rect x="40" y="86" width="1080" height="120" rx="8" fill="#f1f8e9" stroke="#aed581"/>
    <text x="56" y="110" font-size="14" font-weight="bold" fill="#33691e">第二层 · VenueSpec（venues/**/*.yaml —— 一个 venue 一个文件，数百条，新增 ≤30 分钟）</text>
    <rect x="56" y="122" width="200" height="70" rx="6" fill="#ffffff" stroke="#9ccc65"/>
    <text x="66" y="140" font-size="12" font-weight="bold" fill="#263238">jfe.yaml（期刊）</text>
    <text x="66" y="157" font-size="11" fill="#546e7a">issn: 0304-405X · T1</text>
    <text x="66" y="172" font-size="11" fill="#1565c0">metadata: crossref</text>
    <text x="66" y="187" font-size="11" fill="#c62828">fulltext: elsevier_sd · institutional</text>
    <rect x="272" y="122" width="200" height="70" rx="6" fill="#ffffff" stroke="#9ccc65"/>
    <text x="282" y="140" font-size="12" font-weight="bold" fill="#263238">iclr.yaml（会议）</text>
    <text x="282" y="157" font-size="11" fill="#546e7a">dblp: conf/iclr · T1</text>
    <text x="282" y="172" font-size="11" fill="#1565c0">metadata: openreview</text>
    <text x="282" y="187" font-size="11" fill="#2e7d32">fulltext: openreview · auth none</text>
    <rect x="488" y="122" width="200" height="70" rx="6" fill="#ffffff" stroke="#9ccc65"/>
    <text x="498" y="140" font-size="12" font-weight="bold" fill="#263238">colt.yaml（多段 era）</text>
    <text x="498" y="157" font-size="11" fill="#546e7a">2013+ → pmlr</text>
    <text x="498" y="172" font-size="11" fill="#546e7a">2001–12 → springer</text>
    <text x="498" y="187" font-size="11" fill="#546e7a">1988–2000 → acm_dl（D-012）</text>
    <rect x="704" y="122" width="200" height="70" rx="6" fill="#ffffff" stroke="#9ccc65"/>
    <text x="714" y="140" font-size="12" font-weight="bold" fill="#263238">arxiv-cs-lg.yaml（预印本）</text>
    <text x="714" y="157" font-size="11" fill="#546e7a">kind: preprint_channel</text>
    <text x="714" y="172" font-size="11" fill="#546e7a">category: cs.LG</text>
    <text x="714" y="187" font-size="11" fill="#2e7d32">SEARCH 能力 → 订阅 DSL</text>
    <rect x="920" y="122" width="184" height="70" rx="6" fill="#ffffff" stroke="#9ccc65" stroke-dasharray="5,3"/>
    <text x="930" y="140" font-size="12" font-weight="bold" fill="#607d8b">… qje / ms / kdd / ssrn-fen</text>
    <text x="930" y="160" font-size="11" fill="#78909c">校验：id 唯一 · adapter 已注册</text>
    <text x="930" y="176" font-size="11" fill="#78909c">auth 与 adapter 能力兼容</text>
    <text x="930" y="192" font-size="11" fill="#78909c">期刊必有 issn（venues lint）</text>
  </g>

  <!-- ===== Registry ===== -->
  <g>
    <line x1="580" y1="206" x2="580" y2="228" stroke="#546e7a" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="240" y="230" width="680" height="86" rx="8" fill="#fff8e1" stroke="#ffca28" stroke-width="1.5"/>
    <text x="580" y="256" font-size="15" font-weight="bold" text-anchor="middle" fill="#e65100">VenueRegistry（启动加载 · lint 校验 · 路由表构建）</text>
    <text x="580" y="280" font-size="12.5" text-anchor="middle" fill="#455a64">路由键 = (venue_id, year)：era 分段解析 → metadata_adapter 与 fulltext_adapter 可以不同（D-005）</text>
    <text x="580" y="302" font-size="12.5" text-anchor="middle" fill="#455a64">entry points 发现：paper_crawler.adapters 组（内置 + 第三方 pip 包 —— "可插拔的插"）</text>
  </g>

  <!-- 分流箭头 -->
  <g font-size="12" font-weight="bold">
    <path d="M 420 316 L 240 356" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#ab)"/>
    <text x="230" y="342" fill="#1565c0">discover / enumerate（元数据主干）</text>
    <path d="M 580 316 L 580 356" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="470" y="342" fill="#2e7d32">OA 源全阶段</text>
    <path d="M 740 316 L 920 356" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="770" y="342" fill="#c62828">resolve / fetch（全文）</text>
  </g>

  <!-- ===== 第一层：三族 adapter ===== -->
  <!-- aggregator -->
  <g>
    <rect x="40" y="360" width="330" height="180" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
    <text x="56" y="386" font-size="14" font-weight="bold" fill="#0d47a1">aggregator 族（元数据/发现层，6）</text>
    <text x="56" y="412" font-size="12" fill="#37474f">crossref　期刊枚举主干（ISSN+日期，免费 polite）</text>
    <text x="56" y="434" font-size="12" fill="#37474f">dblp　　　会议枚举主干（conf XML，CC0 dump）</text>
    <text x="56" y="456" font-size="12" fill="#37474f">openalex　摘要/OA 链接/topics（信用计费 ⚡）</text>
    <text x="56" y="478" font-size="12" fill="#37474f">s2　　　　引用图/TLDR（1 req/s，需 key）</text>
    <text x="56" y="500" font-size="12" fill="#37474f">unpaywall　OA 副本发现（按 DOI，100k/天）</text>
    <text x="56" y="522" font-size="12" fill="#37474f">core　　　次级 OA 全文兜底</text>
  </g>
  <!-- open_access -->
  <g>
    <rect x="400" y="360" width="360" height="180" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
    <text x="416" y="386" font-size="14" font-weight="bold" fill="#1b5e20">open_access 族（无认证，~20）</text>
    <text x="416" y="412" font-size="12" fill="#37474f">arxiv · ssrn* · openreview · pmlr · cvf</text>
    <text x="416" y="434" font-size="12" fill="#37474f">acl_anthology · neurips_proceedings · aaai_ojs</text>
    <text x="416" y="456" font-size="12" fill="#37474f">acm_dl（2026 全面 OA，D-013）· lipics · usenix</text>
    <text x="416" y="478" font-size="12" fill="#37474f">pvldb · isca · rss_proceedings · nber · econsoc · repec</text>
    <text x="416" y="504" font-size="11.5" fill="#558b2f">* ssrn：free_account_preferred，浏览器上下文 + 1 req/5s（D-011）</text>
    <text x="416" y="524" font-size="11.5" fill="#558b2f">bulk 优先 &gt; API &gt; 静态页 &gt; 渲染页（获取策略阶梯）</text>
  </g>
  <!-- auth_gated -->
  <g>
    <rect x="790" y="360" width="330" height="180" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
    <text x="806" y="386" font-size="14" font-weight="bold" fill="#b71c1c">auth_gated 族（自有凭证，~18）</text>
    <text x="806" y="412" font-size="12" fill="#37474f">elsevier_sd（API 优先）· wiley（TDM API）</text>
    <text x="806" y="434" font-size="12" fill="#37474f">oup_silverchair · uchicago · informs · siam</text>
    <text x="806" y="456" font-size="12" fill="#37474f">ieee_xplore（browser）· aea · cambridge</text>
    <text x="806" y="478" font-size="12" fill="#37474f">springer · mit_press · sage · jstor · pm_research</text>
    <text x="806" y="504" font-size="11.5" fill="#c62828">串行 · 1 req/6s · 日配额 200 · 工作时段窗</text>
    <text x="806" y="524" font-size="11.5" fill="#c62828">session 健康门：每 20 篇 / 15 分钟强制检查</text>
  </g>

  <!-- ===== 协议条 ===== -->
  <g>
    <line x1="205" y1="540" x2="205" y2="566" stroke="#546e7a" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="580" y1="540" x2="580" y2="566" stroke="#546e7a" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="955" y1="540" x2="955" y2="566" stroke="#546e7a" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="40" y="568" width="1080" height="92" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="56" y="594" font-size="14" font-weight="bold" fill="#37474f">统一协议 SourceAdapter（D-003：三族同协议，仅能力声明与 backend 绑定不同）</text>
    <text x="56" y="620" font-size="12.5" fill="#455a64" font-family="Menlo, Consolas, monospace">capabilities: DISCOVER | ENUMERATE | RESOLVE | FETCH | SEARCH　　auth_requirement: none|free_account|subscription|institutional</text>
    <text x="56" y="644" font-size="12.5" fill="#455a64" font-family="Menlo, Consolas, monospace">discover_timeline() · enumerate_issue() · resolve_assets() · fetch_asset() · search() · healthcheck()　＋ default_rate 声明</text>
  </g>

  <!-- ===== L2 绑定 ===== -->
  <g>
    <line x1="360" y1="660" x2="360" y2="686" stroke="#546e7a" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="800" y1="660" x2="800" y2="686" stroke="#546e7a" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="40" y="688" width="530" height="110" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
    <text x="56" y="714" font-size="14" font-weight="bold" fill="#6a1b9a">Fetcher backend 绑定（AssetPlan.url_strategy 决定）</text>
    <text x="56" y="740" font-size="12.5" fill="#455a64">direct → HttpFetcher（httpx；OA 直链、cookie jar 直取）</text>
    <text x="56" y="762" font-size="12.5" fill="#455a64">render_page → BrowserFetcher（Playwright；SSRN Delivery、IEEE stamp）</text>
    <text x="56" y="784" font-size="12.5" fill="#455a64">api_call → 类型化客户端（Elsevier Article API、Wiley TDM）</text>
    <rect x="590" y="688" width="530" height="110" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
    <text x="606" y="714" font-size="14" font-weight="bold" fill="#6a1b9a">AuthProvider 绑定（design/07，auth_gated 族必需）</text>
    <text x="606" y="740" font-size="12.5" fill="#455a64">CookieSession（首登人工→storage_state 复用）· EZProxy（URL 重写）</text>
    <text x="606" y="762" font-size="12.5" fill="#455a64">SSOFlow（Shibboleth/OpenAthens，MFA 人工）· APIKey（keyring）</text>
    <text x="606" y="784" font-size="12.5" fill="#455a64">失效/风控 → BLOCKED 人工介入，绝不对抗（D-006）</text>
  </g>

  <!-- 底注 -->
  <text x="40" y="832" font-size="12" fill="#78909c">杠杆效应（NFR-1/2）：~40 个 adapter（含 planned）覆盖数百 venue —— oup_silverchair 一个服务 QJE/RFS/REStud/RF/EJ；informs 服务 MS/OR/MSOM/IJOC/MOR。</text>
  <text x="40" y="852" font-size="12" fill="#78909c">能力缺失即路由：adapter 无 DISCOVER（如 uchicago）时，Registry 自动把 discover/enumerate 路由给 metadata_source（crossref），resolve/fetch 才到该平台。</text>
</svg>
