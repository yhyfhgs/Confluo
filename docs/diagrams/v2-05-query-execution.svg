<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>从 Query AST 到并行联邦执行与合并</title>
  <desc>对应 docs/plan/v2/04-retrieval-and-routing.md §4、§6–§9、§13、§14.2。解析四步与投机首屏；定稿 AST 后经 TSRG 路由；本地支路恒执行，首屏命中回馈主题后验；远端支路经健全放宽与出站网关；按 cluster 折叠、残差、RRF、交叉编码器重排、个性化挂点后流式返回，并附完整性报告。设计草案，2026-09-27。</desc>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cb5"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9a55"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b06f1a"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1020" fill="#ffffff"/>

  <!-- ===== 标题 ===== -->
  <text x="24" y="38" font-size="22" font-weight="700" fill="#1f2d3d">从 Query AST 到并行联邦执行与合并（交互道）</text>
  <text x="24" y="60" font-size="12" fill="#6b7a89">对应 docs/plan/v2/04-retrieval-and-routing.md §4、§6–§9、§13、§14.2 · 设计草案 2026-09-27 · 时间为 p95 设计预算 [判断]，须压测校准</text>

  <!-- ===== A 解析 ===== -->
  <rect x="24" y="76" width="1232" height="132" rx="10" fill="#f7fafd" stroke="#c5d6ea" stroke-width="1.2"/>
  <text x="36" y="98" font-size="13" font-weight="700" fill="#1f3b5c">A 解析（§4）</text>

  <rect x="36" y="128" width="150" height="60" rx="7" fill="#ffffff" stroke="#7a8ea8"/>
  <text x="111" y="152" font-size="11" font-weight="700" text-anchor="middle" fill="#2c3e50">用户输入</text>
  <text x="111" y="170" font-size="10" text-anchor="middle" fill="#4a5b6c">文本 · 筛选条编辑 · @频道</text>

  <rect x="206" y="128" width="230" height="60" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
  <text x="321" y="152" font-size="11" font-weight="700" text-anchor="middle" fill="#1f3b5c">① 规则快路径（≤20 ms）</text>
  <text x="321" y="170" font-size="10" text-anchor="middle" fill="#1f3b5c">ID 正则 · 字段前缀 · 时间 · 分面词典</text>

  <rect x="458" y="84" width="236" height="36" rx="7" fill="#ffffff" stroke="#7c5cb5" stroke-dasharray="5,3"/>
  <text x="576" y="107" font-size="10.5" text-anchor="middle" fill="#3b2366">② 受约束 LLM（可选 · 异步 · 宽限 1.5 s）</text>

  <rect x="458" y="128" width="236" height="60" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
  <text x="576" y="152" font-size="11" font-weight="700" text-anchor="middle" fill="#1f3b5c">③ 实体链接</text>
  <text x="576" y="170" font-size="10" text-anchor="middle" fill="#1f3b5c">只链库内 ID（pg_trgm + 名称嵌入近邻）</text>

  <rect x="716" y="128" width="236" height="60" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
  <text x="834" y="152" font-size="11" font-weight="700" text-anchor="middle" fill="#1f3b5c">④ FilterChip（04↔07）</text>
  <text x="834" y="170" font-size="10" text-anchor="middle" fill="#1f3b5c">可编辑 · 歧义给候选 · 链不上留作 any 词项</text>

  <rect x="974" y="84" width="270" height="104" rx="7" fill="#ffffff" stroke="#c5d6ea"/>
  <text x="986" y="104" font-size="11" font-weight="700" fill="#1f3b5c">LLM 不进热路径（P-07）</text>
  <g font-size="10" fill="#34495e">
    <text x="986" y="122">首屏不等 LLM：快路径 AST 先投机执行本地</text>
    <text x="986" y="140">宽限期内且用户未交互 → 采纳，upgrade 替换</text>
    <text x="986" y="158">否则 → 以建议筛选条呈现</text>
    <text x="986" y="176">T1 默认关；只用自托管模型（R2-45）</text>
  </g>

  <g stroke="#546e7a" stroke-width="1.5" fill="none">
    <line x1="186" y1="158" x2="204" y2="158" marker-end="url(#ak)"/>
    <line x1="436" y1="158" x2="456" y2="158" marker-end="url(#ak)"/>
    <line x1="694" y1="158" x2="714" y2="158" marker-end="url(#ak)"/>
  </g>
  <g stroke="#7c5cb5" stroke-width="1.3" stroke-dasharray="4,3" fill="none">
    <path d="M400,128 C412,102 430,102 456,102" marker-end="url(#ap)"/>
    <line x1="576" y1="120" x2="576" y2="126" marker-end="url(#ap)"/>
  </g>
  <!-- 解析结果转入规范化 -->
  <path d="M834,188 L834,215 L116,215 L116,250" stroke="#546e7a" stroke-width="1.5" fill="none" marker-end="url(#ak)"/>

  <!-- ===== B 路由 ===== -->
  <rect x="24" y="222" width="1232" height="108" rx="10" fill="#f9fbfd" stroke="#9db6d8" stroke-width="1.2"/>
  <text x="140" y="241" font-size="13" font-weight="700" fill="#1d4f91">B 路由（§6）</text>
  <text x="236" y="241" font-size="10" fill="#4a5b6c">只对定稿 AST 路由（需 LLM 时等其返回或宽限期满）· 筛选条每次编辑 → 新 AST 与 query_hash</text>
  <rect x="860" y="228" width="384" height="20" rx="10" fill="#eef3fb" stroke="#9db6d8"/>
  <text x="1052" y="242" font-size="10" text-anchor="middle" fill="#1d4f91">读：TSRG 快照（route_stat · 覆盖素描）+ 出站网关在线状态</text>

  <g font-size="10" text-anchor="middle" fill="#1f3b5c">
    <rect x="36" y="252" width="160" height="64" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
    <text x="116" y="272" font-size="11" font-weight="700">Canonical AST</text>
    <text x="116" y="290">NNF · 展平 · query_hash</text>
    <text x="116" y="306">裸词→软文本 · @频道内联</text>

    <rect x="212" y="252" width="190" height="64" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
    <text x="307" y="272" font-size="11" font-weight="700">主题后验 P(t|q)</text>
    <text x="307" y="290">过滤 ⊕ 质心 ⊕ 本地命中直方图</text>
    <text x="307" y="306">主分辨率 subfield</text>

    <rect x="418" y="252" width="190" height="64" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
    <text x="513" y="272" font-size="11" font-weight="700">联邦判据（P-01）</text>
    <text x="513" y="290">cov_local &lt; 0.9 或确定命中 &lt; 10</text>
    <text x="513" y="306">LATEST 恒不联邦；LOOKUP 走替补链</text>

    <rect x="624" y="252" width="196" height="64" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
    <text x="722" y="272" font-size="11" font-weight="700">候选端点硬约束</text>
    <text x="722" y="290">exec_side · 策略 · 熔断 · 能力 · p95</text>
    <text x="722" y="306">先放宽：剔除无界，按子查询计成本</text>

    <rect x="836" y="252" width="200" height="64" rx="7" fill="#e8f1fb" stroke="#4a7fc1" stroke-width="1.6"/>
    <text x="936" y="272" font-size="11" font-weight="700">预算贪心 + 最佳单源</text>
    <text x="936" y="290">增益 ≥0.405；n≤10 且闸内精确枚举</text>
    <text x="936" y="306">Thompson 采样 η · 事后剪枝</text>

    <rect x="1052" y="252" width="192" height="64" rx="7" fill="#e8f1fb" stroke="#4a7fc1"/>
    <text x="1148" y="272" font-size="11" font-weight="700">执行计划 DAG</text>
    <text x="1148" y="290">总截止 3 s · 各源子截止</text>
    <text x="1148" y="306">plan_key 复用缓存</text>
  </g>
  <g stroke="#546e7a" stroke-width="1.5" fill="none">
    <line x1="196" y1="284" x2="210" y2="284" marker-end="url(#ak)"/>
    <line x1="402" y1="284" x2="416" y2="284" marker-end="url(#ak)"/>
    <line x1="608" y1="284" x2="622" y2="284" marker-end="url(#ak)"/>
    <line x1="820" y1="284" x2="834" y2="284" marker-end="url(#ak)"/>
    <line x1="1036" y1="284" x2="1050" y2="284" marker-end="url(#ak)"/>
  </g>
  <!-- AST → 本地支路（恒执行）；首屏命中回馈 P(t|q)；计划 → 远端支路（仅当联邦） -->
  <line x1="116" y1="316" x2="116" y2="342" stroke="#4f9a55" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="124" y="336" font-size="10" fill="#2e6b33">恒执行：投机首屏不经路由</text>
  <line x1="300" y1="344" x2="300" y2="319" stroke="#4f9a55" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ag)"/>
  <text x="306" y="336" font-size="10" fill="#2e6b33">非个性化首屏命中 → p_r</text>
  <line x1="1148" y1="316" x2="1148" y2="342" stroke="#7c5cb5" stroke-width="1.8" marker-end="url(#ap)"/>
  <text x="1155" y="336" font-size="10" fill="#3b2366">仅当联邦</text>
  <text x="513" y="336" font-size="10" text-anchor="middle" fill="#1d4f91">范围完整时不联邦（§6.3）</text>
  <text x="722" y="336" font-size="10" text-anchor="middle" fill="#1d4f91">剔除单项超预算端点（§6.6）</text>

  <!-- ===== C 本地支路 ===== -->
  <rect x="24" y="344" width="600" height="302" rx="10" fill="#f4fbf4" stroke="#b9dcb9" stroke-width="1.2"/>
  <text x="36" y="364" font-size="13" font-weight="700" fill="#1f4d24">C 本地支路（§9）</text>

  <rect x="36" y="374" width="280" height="46" rx="7" fill="#ffffff" stroke="#4f9a55"/>
  <text x="176" y="393" font-size="11" font-weight="700" text-anchor="middle" fill="#1f4d24">Roaring 分面位图求交 → 精确 |C|</text>
  <text x="176" y="410" font-size="10" text-anchor="middle" fill="#2e6b33">subfield · topic · 年 · 类型 · OA · venue · src 等</text>
  <rect x="332" y="374" width="280" height="46" rx="7" fill="#ffffff" stroke="#4f9a55"/>
  <text x="472" y="393" font-size="11" font-weight="700" text-anchor="middle" fill="#1f4d24">选择率规划（§9.5）</text>
  <text x="472" y="410" font-size="10" text-anchor="middle" fill="#2e6b33">|C| ≤ 2 万 → 精确打分；否则迭代扫描 / 并行精确</text>
  <line x1="316" y1="397" x2="330" y2="397" stroke="#4f9a55" stroke-width="1.5" marker-end="url(#ag)"/>

  <g stroke="#4f9a55" stroke-width="1.3" fill="none">
    <line x1="472" y1="420" x2="472" y2="428"/>
    <line x1="129" y1="428" x2="518" y2="428"/>
    <line x1="129" y1="428" x2="129" y2="434" marker-end="url(#ag)"/>
    <line x1="323" y1="428" x2="323" y2="434" marker-end="url(#ag)"/>
    <line x1="518" y1="428" x2="518" y2="434" marker-end="url(#ag)"/>
  </g>
  <g text-anchor="middle">
    <rect x="36" y="436" width="186" height="46" rx="7" fill="#eaf6ea" stroke="#4f9a55"/>
    <text x="129" y="455" font-size="11" font-weight="700" fill="#1f4d24">BM25（pg_textsearch）</text>
    <text x="129" y="472" font-size="10" fill="#2e6b33">软文本 OR 打分 · 标题/全文两列</text>
    <rect x="230" y="436" width="186" height="46" rx="7" fill="#eaf6ea" stroke="#4f9a55"/>
    <text x="323" y="455" font-size="11" font-weight="700" fill="#1f4d24">tsvector / GIN 谓词</text>
    <text x="323" y="472" font-size="10" fill="#2e6b33">布尔 · 短语 · 邻近 · 字段</text>
    <rect x="424" y="436" width="188" height="46" rx="7" fill="#eaf6ea" stroke="#4f9a55"/>
    <text x="518" y="455" font-size="11" font-weight="700" fill="#1f4d24">HNSW / 精确余弦</text>
    <text x="518" y="472" font-size="10" fill="#2e6b33">halfvec（维度随 Q7）· 全维精排</text>

    <rect x="36" y="494" width="280" height="46" rx="7" fill="#eaf6ea" stroke="#4f9a55"/>
    <text x="176" y="513" font-size="11" font-weight="700" fill="#1f4d24">图邻域 ≤2 跳（EXPAND）</text>
    <text x="176" y="530" font-size="10" fill="#2e6b33">文献耦合 · 共被引 · 枢纽剪枝 · 夜间 CSR 近邻</text>
    <rect x="332" y="494" width="280" height="46" rx="7" fill="#fdecef" stroke="#c2185b"/>
    <text x="472" y="513" font-size="11" font-weight="700" fill="#8e1446">个人谓词 Personal（usr 域，RLS）</text>
    <text x="472" y="530" font-size="10" fill="#8e1446">unseen · saved · in_library · rated_ge；永不下推</text>
  </g>
  <rect x="36" y="552" width="576" height="86" rx="7" fill="#ffffff" stroke="#b9dcb9"/>
  <g font-size="10.5" fill="#2e4d31">
    <text x="48" y="572">• 本地列表即作品级（05 的 work 即 cluster），列内折叠主要针对远端列表</text>
    <text x="48" y="590">• 私有层：platform 只在用户设备上检索（R2-27）；personal 本机部署才有 private 列表</text>
    <text x="48" y="608">• 位图按入库水位增量同步，水位之后的尾部用 SQL 补查（§9.4）</text>
    <text x="48" y="626">• 索引只收权利闸放行的字段（B 类摘要按 R2-21 默认纳入、设开关、可逆）</text>
  </g>

  <!-- ===== D 远端支路 ===== -->
  <rect x="640" y="344" width="616" height="302" rx="10" fill="#f8f5fc" stroke="#d3c6ea" stroke-width="1.2"/>
  <text x="652" y="364" font-size="13" font-weight="700" fill="#3b2366">D 远端支路（§7、§8、§13）</text>

  <rect x="954" y="374" width="290" height="46" rx="7" fill="#ffffff" stroke="#7c5cb5"/>
  <text x="1099" y="393" font-size="11" font-weight="700" text-anchor="middle" fill="#3b2366">健全放宽 relax(P, SCD)（§7）</text>
  <text x="1099" y="410" font-size="10" text-anchor="middle" fill="#4a3a6b">NNF · 不支持 → true · 正负文字分规则 · 等价拆分</text>
  <rect x="652" y="374" width="290" height="46" rx="7" fill="#ffffff" stroke="#7c5cb5"/>
  <text x="797" y="393" font-size="11" font-weight="700" text-anchor="middle" fill="#3b2366">子查询 plan_key（无用户信息）</text>
  <text x="797" y="410" font-size="10" text-anchor="middle" fill="#4a3a6b">= 缓存键 + singleflight 键；个人谓词不下推</text>
  <line x1="954" y1="397" x2="944" y2="397" stroke="#7c5cb5" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="797" y1="420" x2="797" y2="432" stroke="#7c5cb5" stroke-width="1.5" marker-end="url(#ap)"/>

  <rect x="652" y="434" width="592" height="66" rx="8" fill="#fff7e6" stroke="#d08a2e" stroke-width="1.6"/>
  <text x="948" y="454" font-size="12" font-weight="700" text-anchor="middle" fill="#6b4212">出站网关 Egress Gateway（02 的 P13，唯一公网出口）</text>
  <text x="948" y="472" font-size="10.5" text-anchor="middle" fill="#6b4212">robots 先行闸 · 响应头配额账本 · AIMD（只降不超）· 重试预算（≤3 次/请求，≤10%）</text>
  <text x="948" y="489" font-size="10.5" text-anchor="middle" fill="#6b4212">按源×端点熔断（含 POLICY_BLOCKED）· 三道舱壁 · TTL 缓存 min(24h, 0.1/λ̂) · FetchLog</text>

  <g stroke="#d08a2e" stroke-width="1.2" fill="none">
    <line x1="704" y1="500" x2="704" y2="510" marker-end="url(#ao)"/>
    <line x1="818" y1="500" x2="818" y2="510" marker-end="url(#ao)"/>
    <line x1="932" y1="500" x2="932" y2="510" marker-end="url(#ao)"/>
    <line x1="1046" y1="500" x2="1046" y2="510" marker-end="url(#ao)"/>
    <line x1="1176" y1="500" x2="1176" y2="510" marker-end="url(#ao)"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#3b2366">
    <rect x="652" y="512" width="104" height="30" rx="6" fill="#f1ebfa" stroke="#7c5cb5"/><text x="704" y="531">OpenAlex</text>
    <rect x="766" y="512" width="104" height="30" rx="6" fill="#f1ebfa" stroke="#7c5cb5"/><text x="818" y="531">Crossref</text>
    <rect x="880" y="512" width="104" height="30" rx="6" fill="#f1ebfa" stroke="#7c5cb5"/><text x="932" y="531">S2</text>
    <rect x="994" y="512" width="104" height="30" rx="6" fill="#f1ebfa" stroke="#7c5cb5"/><text x="1046" y="531">Europe PMC</text>
    <rect x="1108" y="512" width="136" height="30" rx="6" fill="#f1ebfa" stroke="#7c5cb5" stroke-dasharray="4,3"/><text x="1176" y="531">PubMed（NCBI 确认后）</text>
  </g>
  <rect x="652" y="552" width="592" height="86" rx="7" fill="#ffffff" stroke="#d3c6ea"/>
  <g font-size="10.5" fill="#4a3a6b">
    <text x="664" y="572">• 同能力替补链；首选超过 p95 未返回才对冲，只对不同主机，对冲 ≤5%</text>
    <text x="664" y="590">• 禁止对同一第三方主机对冲；挑战页 → POLICY_BLOCKED，不自动恢复</text>
    <text x="664" y="608">• 预计排队超过子截止 → budget_exhausted 快速失败，不排队；EPMC 按 Crawl-delay 10 s 全平台限速</text>
    <text x="664" y="626">• 截止后到达的结果写缓存（礼貌成本已付，不丢弃）</text>
  </g>

  <!-- 两条支路汇入合并 -->
  <line x1="324" y1="646" x2="324" y2="666" stroke="#4f9a55" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="948" y1="646" x2="948" y2="666" stroke="#7c5cb5" stroke-width="1.8" marker-end="url(#ap)"/>

  <!-- ===== E 汇合 ===== -->
  <rect x="24" y="668" width="1232" height="176" rx="10" fill="#fffaf2" stroke="#efd3a8" stroke-width="1.2"/>
  <text x="36" y="688" font-size="13" font-weight="700" fill="#6b4212">E 汇合与流式返回（§8）</text>
  <g font-size="10" text-anchor="middle" fill="#5a3a10">
    <rect x="36" y="698" width="186" height="56" rx="7" fill="#fff4e5" stroke="#d08a2e"/>
    <text x="129" y="720" font-size="11" font-weight="700">规范化 + 标识符解析</text>
    <text x="129" y="738">identifier → version → work</text>
    <rect x="236" y="698" width="186" height="56" rx="7" fill="#fff4e5" stroke="#d08a2e"/>
    <text x="329" y="720" font-size="11" font-weight="700">列内按 cluster 折叠</text>
    <text x="329" y="738">名次取成员最小；弱信号不合并</text>
    <rect x="436" y="698" width="186" height="56" rx="7" fill="#fff4e5" stroke="#d08a2e"/>
    <text x="529" y="720" font-size="11" font-weight="700">本地残差（三值逻辑）</text>
    <text x="529" y="738">计数：远端命中、本地拒绝</text>
