<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Paper Crawler · 六阶段 Pipeline · 对应 docs/design/05-pipeline.md · 2026-07-20 -->
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="900" fill="#fafbfc"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#263238">六阶段 Pipeline（D-004）：清单先行、下载置后、阶段幂等</text>
  <text x="40" y="64" font-size="12" fill="#78909c">对应 design/05-pipeline.md · 阶段间只通过持久化实体通信 · 2026-07-20</text>

  <!-- ===== 六阶段 ===== -->
  <g>
    <!-- discover -->
    <rect x="40" y="96" width="168" height="130" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
    <text x="124" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d47a1">1 discover</text>
    <text x="124" y="144" font-size="11.5" text-anchor="middle" fill="#455a64">输入：VenueSpec (+since)</text>
    <text x="124" y="162" font-size="11.5" text-anchor="middle" fill="#455a64">时间轴：卷/期/届清单</text>
    <text x="124" y="180" font-size="11.5" text-anchor="middle" fill="#455a64">典型源：Crossref / DBLP</text>
    <text x="124" y="202" font-size="10.5" text-anchor="middle" fill="#78909c">幂等键 (venue,vol,issue)</text>
    <text x="124" y="217" font-size="10.5" text-anchor="middle" fill="#78909c">新鲜度 24h</text>
    <!-- enumerate -->
    <rect x="228" y="96" width="168" height="130" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
    <text x="312" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#0d47a1">2 enumerate</text>
    <text x="312" y="144" font-size="11.5" text-anchor="middle" fill="#455a64">输入：Issue</text>
    <text x="312" y="162" font-size="11.5" text-anchor="middle" fill="#455a64">展开论文级清单（元数据）</text>
    <text x="312" y="180" font-size="11.5" text-anchor="middle" fill="#455a64">批量 upsert，事务=一期</text>
    <text x="312" y="202" font-size="10.5" text-anchor="middle" fill="#78909c">幂等键 (source,source_key)</text>
    <text x="312" y="217" font-size="10.5" text-anchor="middle" fill="#78909c">新鲜度 7d</text>
    <!-- resolve -->
    <rect x="416" y="96" width="168" height="130" rx="8" fill="#fff8e1" stroke="#ffca28" stroke-width="1.5"/>
    <text x="500" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#e65100">3 resolve</text>
    <text x="500" y="144" font-size="11.5" text-anchor="middle" fill="#455a64">输入：Paper</text>
    <text x="500" y="162" font-size="11.5" text-anchor="middle" fill="#455a64">定位资产 URL + 认证需求</text>
    <text x="500" y="180" font-size="11.5" text-anchor="middle" fill="#455a64">entitlement 预检（能查则查）</text>
    <text x="500" y="202" font-size="10.5" text-anchor="middle" fill="#78909c">幂等键 (paper,asset_kind)</text>
    <text x="500" y="217" font-size="10.5" text-anchor="middle" fill="#78909c">选择/过滤在此定界</text>
    <!-- fetch -->
    <rect x="604" y="96" width="168" height="130" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
    <text x="688" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#b71c1c">4 fetch</text>
    <text x="688" y="144" font-size="11.5" text-anchor="middle" fill="#455a64">输入：Asset(planned)</text>
    <text x="688" y="162" font-size="11.5" text-anchor="middle" fill="#455a64">限速下载 · *.part → 校验</text>
    <text x="688" y="180" font-size="11.5" text-anchor="middle" fill="#455a64">→ 原子 rename 落盘</text>
    <text x="688" y="202" font-size="10.5" text-anchor="middle" fill="#78909c">幂等键 asset_id</text>
    <text x="688" y="217" font-size="10.5" text-anchor="middle" fill="#78909c">魔数 %PDF · session 健康门</text>
    <!-- extract -->
    <rect x="792" y="96" width="168" height="130" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
    <text x="876" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d32">5 extract</text>
    <text x="876" y="144" font-size="11.5" text-anchor="middle" fill="#455a64">输入：Asset(fetched,pdf)</text>
    <text x="876" y="162" font-size="11.5" text-anchor="middle" fill="#455a64">本地：元数据核对</text>
    <text x="876" y="180" font-size="11.5" text-anchor="middle" fill="#455a64">全文抽取（GROBID 可选）</text>
    <text x="876" y="202" font-size="10.5" text-anchor="middle" fill="#78909c">幂等键 (asset,extractor_ver)</text>
    <text x="876" y="217" font-size="10.5" text-anchor="middle" fill="#78909c">无网络</text>
    <!-- ingest -->
    <rect x="980" y="96" width="140" height="130" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
    <text x="1050" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d32">6 ingest</text>
    <text x="1050" y="144" font-size="11.5" text-anchor="middle" fill="#455a64">合并去重（D-007）</text>
    <text x="1050" y="162" font-size="11.5" text-anchor="middle" fill="#455a64">identifier 强合并</text>
    <text x="1050" y="180" font-size="11.5" text-anchor="middle" fill="#455a64">preprint_of 建边</text>
    <text x="1050" y="202" font-size="10.5" text-anchor="middle" fill="#78909c">确定性规则版本</text>
    <text x="1050" y="217" font-size="10.5" text-anchor="middle" fill="#78909c">每次运行尾部自动</text>
  </g>
  <!-- 阶段间箭头 -->
  <g stroke="#1565c0" stroke-width="2" fill="none">
    <line x1="208" y1="161" x2="228" y2="161" marker-end="url(#p)"/>
    <line x1="396" y1="161" x2="416" y2="161" marker-end="url(#p)"/>
    <line x1="584" y1="161" x2="604" y2="161" marker-end="url(#p)"/>
    <line x1="772" y1="161" x2="792" y2="161" marker-end="url(#p)"/>
    <line x1="960" y1="161" x2="980" y2="161" marker-end="url(#p)"/>
  </g>
  <!-- dry-run 边界 -->
  <line x1="594" y1="88" x2="594" y2="300" stroke="#e65100" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="594" y="318" font-size="12" font-weight="bold" text-anchor="middle" fill="#e65100">--dry-run 停止线：到 resolve 为止，只报数不下载（FR-05）</text>

  <!-- ===== 持久化实体条 ===== -->
  <g stroke="#78909c" stroke-width="1.4" fill="none">
    <line x1="124" y1="226" x2="124" y2="250" marker-end="url(#g)"/>
    <line x1="312" y1="226" x2="312" y2="250" marker-end="url(#g)"/>
    <line x1="500" y1="226" x2="500" y2="250" marker-end="url(#g)"/>
    <line x1="688" y1="226" x2="688" y2="250" marker-end="url(#g)"/>
    <line x1="876" y1="226" x2="876" y2="250" marker-end="url(#g)"/>
    <line x1="1050" y1="226" x2="1050" y2="250" marker-end="url(#g)"/>
  </g>
  <g>
    <rect x="40" y="252" width="1080" height="44" rx="8" fill="#eceff1" stroke="#b0bec5"/>
    <text x="124" y="279" font-size="12.5" text-anchor="middle" fill="#37474f">Issue / VenueEra</text>
    <text x="312" y="279" font-size="12.5" text-anchor="middle" fill="#37474f">Paper + Identifier</text>
    <text x="500" y="279" font-size="12.5" text-anchor="middle" fill="#37474f">Asset(planned)</text>
    <text x="688" y="279" font-size="12.5" text-anchor="middle" fill="#37474f">文件 + Asset(fetched) + FetchLog</text>
    <text x="876" y="279" font-size="12.5" text-anchor="middle" fill="#37474f">Fulltext</text>
    <text x="1050" y="279" font-size="12.5" text-anchor="middle" fill="#37474f">PaperRelation + 索引</text>
  </g>

  <!-- ===== 任务状态机 ===== -->
  <g>
    <rect x="40" y="352" width="560" height="240" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="56" y="378" font-size="14" font-weight="bold" fill="#37474f">Task 状态机（每阶段任务持久化，幂等键去重入队）</text>
    <rect x="70" y="400" width="110" height="40" rx="20" fill="#eceff1" stroke="#90a4ae"/>
    <text x="125" y="425" font-size="13" text-anchor="middle" fill="#263238">PENDING</text>
    <rect x="240" y="400" width="110" height="40" rx="20" fill="#e3f2fd" stroke="#64b5f6"/>
    <text x="295" y="425" font-size="13" text-anchor="middle" fill="#0d47a1">RUNNING</text>
    <rect x="430" y="400" width="110" height="40" rx="20" fill="#e8f5e9" stroke="#66bb6a"/>
    <text x="485" y="425" font-size="13" text-anchor="middle" fill="#1b5e20">DONE</text>
    <rect x="240" y="470" width="110" height="40" rx="20" fill="#ffebee" stroke="#ef9a9a"/>
    <text x="295" y="495" font-size="13" text-anchor="middle" fill="#b71c1c">FAILED</text>
    <rect x="430" y="470" width="110" height="40" rx="20" fill="#fff8e1" stroke="#ffb300"/>
    <text x="485" y="495" font-size="13" text-anchor="middle" fill="#e65100">BLOCKED</text>
    <g stroke="#546e7a" stroke-width="1.6" fill="none">
      <line x1="180" y1="420" x2="240" y2="420" marker-end="url(#g)"/>
      <line x1="350" y1="420" x2="430" y2="420" marker-end="url(#g)"/>
      <line x1="295" y1="440" x2="295" y2="470" marker-end="url(#g)"/>
      <path d="M 350 490 L 430 490" marker-end="url(#g)"/>
      <path d="M 240 490 C 150 490 125 470 125 440" marker-end="url(#g)"/>
      <path d="M 485 470 C 485 452 400 446 355 432" marker-end="url(#g)"/>
    </g>
    <text x="380" y="484" font-size="10.5" fill="#78909c">auth/challenge/config</text>
    <text x="150" y="508" font-size="10.5" fill="#78909c">retry --class transient（按分类）</text>
    <text x="368" y="533" font-size="10.5" fill="#78909c">resume（人工处理后回 PENDING）</text>
    <text x="56" y="560" font-size="11.5" fill="#455a64">BLOCKED 不占重试次数、不自动恢复；DONE 按新鲜度策略跳过或刷新（--force 覆盖）。</text>
    <text x="56" y="580" font-size="11.5" fill="#455a64">断点续爬：kill -9 后重跑 → 查幂等键跳过已完成（AC-1.3 零重复零遗漏）。</text>
  </g>

  <!-- ===== 错误分类 ===== -->
  <g>
    <rect x="620" y="352" width="500" height="240" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="636" y="378" font-size="14" font-weight="bold" fill="#37474f">错误分类学（统一 error_class → 处理）</text>
    <g font-size="11.5" fill="#455a64">
      <text x="636" y="404">transient　　超时/5xx　　　　→ 退避重试 3 次（2/8/30s）</text>
      <text x="636" y="426">rate_limited　429/Retry-After　→ 按头退避；3 连 → 域冷却 1h</text>
      <text x="636" y="448">auth_expired　401/302→login　→ 整批 BLOCKED(auth)</text>
      <text x="636" y="470">no_entitlement 403 且 session 健康 → 标记 + Unpaywall 兜底</text>
      <text x="636" y="492">challenge　　CAPTCHA/CF 特征 → BLOCKED + 平台冷却 24h</text>
      <text x="636" y="514">gone　　　　404/410　　　　→ 标 gone；era 级走 Wayback</text>
      <text x="636" y="536">parse　　　　解析 0 命中　　　→ FAILED + canary 标红（腐化）</text>
      <text x="636" y="558">integrity　　非 %PDF/大小异常 → 重下 1 次；疑 auth_leak</text>
      <text x="636" y="580">config　　　spec 非法/凭证缺失 → 启动拦截或 BLOCKED(config)</text>
    </g>
  </g>

  <!-- ===== CLI 映射 ===== -->
  <g>
    <rect x="40" y="620" width="1080" height="150" rx="8" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1.2"/>
    <text x="56" y="646" font-size="14" font-weight="bold" fill="#37474f">CLI ↔ 阶段映射（design/05 §6）</text>
    <g font-size="12.5" fill="#455a64" font-family="Menlo, Consolas, monospace">
      <text x="56" y="674">crawler timeline &lt;venue&gt;                  → 1        crawler list &lt;venue&gt; --volume V        → 1–2（清单预览）</text>
      <text x="56" y="698">crawler pull &lt;venue&gt; --volume/--year/--doi → 1–4（--extract 加 5；ingest 自动）        --dry-run 到 3 为止</text>
      <text x="56" y="722">crawler grab --doi/--arxiv/--ssrn          → 单篇跨 venue 精取        crawler backfill &lt;venue&gt; --from YEAR → 低优先级历史回填</text>
      <text x="56" y="746">crawler watch &lt;sub&gt;                        → SEARCH+增量        crawler status/resume/retry/verify → 任务运维与对账</text>
    </g>
  </g>

  <!-- 底注 -->
  <text x="40" y="800" font-size="12" fill="#78909c">调度：全局并发 4 · per-domain 并发 1 · token bucket 取最保守值（adapter 声明 → VenueSpec 覆盖 → CLI 临时覆盖）；auth_gated 同 profile 全局串行 + 工作时段窗（8:00–23:00）。</text>
  <text x="40" y="820" font-size="12" fill="#78909c">观测：结构化 jsonl 日志（task_id/venue/stage/domain/error_class）+ FetchLog 逐请求审计（限速合规证据，AC-4.4）+ 运行报告 + canary 健康矩阵。</text>
  <text x="40" y="840" font-size="12" fill="#78909c">优先级：交互式（pull/grab）＞ watch 增量 ＞ backfill；同级 FIFO。</text>
</svg>
