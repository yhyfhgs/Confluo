<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Paper Crawler · 总体架构分层图 · 对应 docs/design/01-architecture.md · 2026-07-20 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="800" fill="#fafbfc"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#263238">Paper Crawler · 总体架构（六层，依赖只向下）</text>
  <text x="40" y="64" font-size="12" fill="#78909c">对应 design/01-architecture.md · 2026-07-20</text>

  <!-- ===== 层带 ===== -->
  <!-- L6 接口层 -->
  <g>
    <rect x="40" y="88" width="800" height="88" rx="8" fill="#eceff1" stroke="#b0bec5"/>
    <text x="56" y="112" font-size="14" font-weight="bold" fill="#37474f">L6 接口层</text>
    <rect x="200" y="104" width="180" height="52" rx="6" fill="#ffffff" stroke="#90a4ae"/>
    <text x="290" y="126" font-size="13" text-anchor="middle" fill="#263238">CLI (typer)</text>
    <text x="290" y="144" font-size="11" text-anchor="middle" fill="#607d8b">pull / timeline / watch / auth…</text>
    <rect x="410" y="104" width="200" height="52" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="5,3"/>
    <text x="510" y="126" font-size="13" text-anchor="middle" fill="#263238">未来：TUI / daemon</text>
    <text x="510" y="144" font-size="11" text-anchor="middle" fill="#607d8b">cron / launchd 定时触发</text>
  </g>

  <!-- L5 编排层 -->
  <g>
    <rect x="40" y="188" width="800" height="88" rx="8" fill="#e3f2fd" stroke="#90caf9"/>
    <text x="56" y="212" font-size="14" font-weight="bold" fill="#1565c0">L5 编排层</text>
    <rect x="200" y="204" width="150" height="52" rx="6" fill="#ffffff" stroke="#90caf9"/>
    <text x="275" y="234" font-size="13" text-anchor="middle" fill="#263238">Orchestrator</text>
    <rect x="366" y="204" width="170" height="52" rx="6" fill="#ffffff" stroke="#90caf9"/>
    <text x="451" y="226" font-size="13" text-anchor="middle" fill="#263238">Task 队列 / 状态机</text>
    <text x="451" y="244" font-size="11" text-anchor="middle" fill="#607d8b">PENDING…BLOCKED</text>
    <rect x="552" y="204" width="150" height="52" rx="6" fill="#ffffff" stroke="#90caf9"/>
    <text x="627" y="226" font-size="13" text-anchor="middle" fill="#263238">调度·限速协调</text>
    <text x="627" y="244" font-size="11" text-anchor="middle" fill="#607d8b">优先级 / 并发闸</text>
    <rect x="718" y="204" width="106" height="52" rx="6" fill="#ffffff" stroke="#90caf9"/>
    <text x="771" y="226" font-size="13" text-anchor="middle" fill="#263238">断点恢复</text>
    <text x="771" y="244" font-size="11" text-anchor="middle" fill="#607d8b">watch 增量</text>
  </g>

  <!-- L4 领域层 -->
  <g>
    <rect x="40" y="288" width="800" height="88" rx="8" fill="#e8f5e9" stroke="#a5d6a7"/>
    <text x="56" y="312" font-size="14" font-weight="bold" fill="#2e7d32">L4 领域层</text>
    <rect x="200" y="304" width="360" height="52" rx="6" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="380" y="326" font-size="13" text-anchor="middle" fill="#263238">六阶段 Pipeline（D-004）</text>
    <text x="380" y="344" font-size="11" text-anchor="middle" fill="#607d8b">discover→enumerate→resolve→fetch→extract→ingest</text>
    <rect x="576" y="304" width="120" height="52" rx="6" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="636" y="326" font-size="13" text-anchor="middle" fill="#263238">去重合并</text>
    <text x="636" y="344" font-size="11" text-anchor="middle" fill="#607d8b">D-007 identifier 图</text>
    <rect x="712" y="304" width="112" height="52" rx="6" fill="#ffffff" stroke="#a5d6a7"/>
    <text x="768" y="326" font-size="13" text-anchor="middle" fill="#263238">订阅 DSL</text>
    <text x="768" y="344" font-size="11" text-anchor="middle" fill="#607d8b">topic/tag 过滤</text>
  </g>

  <!-- L3 插件层 -->
  <g>
    <rect x="40" y="388" width="800" height="108" rx="8" fill="#fff8e1" stroke="#ffe082"/>
    <text x="56" y="412" font-size="14" font-weight="bold" fill="#f57f17">L3 插件层</text>
    <rect x="200" y="404" width="140" height="72" rx="6" fill="#ffffff" stroke="#ffca28"/>
    <text x="270" y="428" font-size="13" text-anchor="middle" fill="#263238">VenueRegistry</text>
    <text x="270" y="446" font-size="11" text-anchor="middle" fill="#607d8b">VenueSpec YAML</text>
    <text x="270" y="462" font-size="11" text-anchor="middle" fill="#607d8b">路由 = (venue, year)</text>
    <rect x="356" y="404" width="150" height="72" rx="6" fill="#e8f5e9" stroke="#66bb6a"/>
    <text x="431" y="426" font-size="13" text-anchor="middle" fill="#1b5e20">open_access 族</text>
    <text x="431" y="444" font-size="11" text-anchor="middle" fill="#33691e">arxiv · ssrn · openreview</text>
    <text x="431" y="460" font-size="11" text-anchor="middle" fill="#33691e">pmlr · cvf · acl · acm_dl…</text>
    <rect x="522" y="404" width="150" height="72" rx="6" fill="#ffebee" stroke="#ef9a9a"/>
    <text x="597" y="426" font-size="13" text-anchor="middle" fill="#b71c1c">auth_gated 族</text>
    <text x="597" y="444" font-size="11" text-anchor="middle" fill="#c62828">elsevier · wiley · oup</text>
    <text x="597" y="460" font-size="11" text-anchor="middle" fill="#c62828">informs · ieee · siam…</text>
    <rect x="688" y="404" width="136" height="72" rx="6" fill="#e3f2fd" stroke="#64b5f6"/>
    <text x="756" y="426" font-size="13" text-anchor="middle" fill="#0d47a1">aggregator</text>
    <text x="756" y="444" font-size="11" text-anchor="middle" fill="#1565c0">crossref · dblp</text>
    <text x="756" y="460" font-size="11" text-anchor="middle" fill="#1565c0">openalex · s2 · unpaywall</text>
  </g>

  <!-- L2 获取基建层 -->
  <g>
    <rect x="40" y="508" width="800" height="88" rx="8" fill="#f3e5f5" stroke="#ce93d8"/>
    <text x="56" y="532" font-size="14" font-weight="bold" fill="#6a1b9a">L2 获取基建</text>
    <rect x="200" y="524" width="120" height="52" rx="6" fill="#ffffff" stroke="#ce93d8"/>
    <text x="260" y="546" font-size="13" text-anchor="middle" fill="#263238">HttpFetcher</text>
    <text x="260" y="562" font-size="11" text-anchor="middle" fill="#607d8b">httpx · ETag 缓存</text>
    <rect x="336" y="524" width="130" height="52" rx="6" fill="#ffffff" stroke="#ce93d8"/>
    <text x="401" y="546" font-size="13" text-anchor="middle" fill="#263238">BrowserFetcher</text>
    <text x="401" y="562" font-size="11" text-anchor="middle" fill="#607d8b">Playwright 上下文池</text>
    <rect x="482" y="524" width="120" height="52" rx="6" fill="#ffffff" stroke="#ce93d8"/>
    <text x="542" y="546" font-size="13" text-anchor="middle" fill="#263238">RateLimiter</text>
    <text x="542" y="562" font-size="11" text-anchor="middle" fill="#607d8b">per-domain 桶</text>
    <rect x="618" y="524" width="120" height="52" rx="6" fill="#ffffff" stroke="#ce93d8"/>
    <text x="678" y="546" font-size="13" text-anchor="middle" fill="#263238">AuthProvider 族</text>
    <text x="678" y="562" font-size="11" text-anchor="middle" fill="#607d8b">cookie/EZProxy/SSO/key</text>
    <rect x="754" y="524" width="70" height="52" rx="6" fill="#ffffff" stroke="#ce93d8"/>
    <text x="789" y="546" font-size="12" text-anchor="middle" fill="#263238">Retry ·</text>
    <text x="789" y="562" font-size="12" text-anchor="middle" fill="#263238">robots</text>
  </g>

  <!-- L1 存储与观测层 -->
  <g>
    <rect x="40" y="608" width="800" height="88" rx="8" fill="#eceff1" stroke="#b0bec5"/>
    <text x="56" y="632" font-size="14" font-weight="bold" fill="#37474f">L1 存储观测</text>
    <rect x="200" y="624" width="140" height="52" rx="6" fill="#ffffff" stroke="#90a4ae"/>
    <text x="270" y="646" font-size="13" text-anchor="middle" fill="#263238">SQLite (WAL)</text>
    <text x="270" y="662" font-size="11" text-anchor="middle" fill="#607d8b">→ PostgreSQL 预留</text>
    <rect x="356" y="624" width="130" height="52" rx="6" fill="#ffffff" stroke="#90a4ae"/>
    <text x="421" y="646" font-size="13" text-anchor="middle" fill="#263238">文件库 data/</text>
    <text x="421" y="662" font-size="11" text-anchor="middle" fill="#607d8b">pdf/si/fulltext</text>
    <rect x="502" y="624" width="150" height="52" rx="6" fill="#ffffff" stroke="#90a4ae"/>
    <text x="577" y="646" font-size="13" text-anchor="middle" fill="#263238">结构化日志 + FetchLog</text>
    <text x="577" y="662" font-size="11" text-anchor="middle" fill="#607d8b">jsonl · 限速审计</text>
    <rect x="668" y="624" width="156" height="52" rx="6" fill="#ffffff" stroke="#90a4ae"/>
    <text x="746" y="646" font-size="13" text-anchor="middle" fill="#263238">报告 / canary 矩阵</text>
    <text x="746" y="662" font-size="11" text-anchor="middle" fill="#607d8b">运行摘要 · 漂移哨兵</text>
  </g>

  <!-- 依赖箭头（层间） -->
  <g stroke="#546e7a" stroke-width="1.6" fill="none">
    <line x1="120" y1="176" x2="120" y2="188" marker-end="url(#arrow)"/>
    <line x1="120" y1="276" x2="120" y2="288" marker-end="url(#arrow)"/>
    <line x1="120" y1="376" x2="120" y2="388" marker-end="url(#arrow)"/>
    <line x1="120" y1="496" x2="120" y2="508" marker-end="url(#arrow)"/>
    <line x1="120" y1="596" x2="120" y2="608" marker-end="url(#arrow)"/>
  </g>

  <!-- 右侧：合规红线 -->
  <g>
    <rect x="864" y="88" width="256" height="238" rx="8" fill="#fff5f5" stroke="#e57373" stroke-width="1.5"/>
    <text x="880" y="114" font-size="14" font-weight="bold" fill="#c62828">合规红线（AGENTS.md §6）</text>
    <text x="880" y="140" font-size="12" fill="#455a64">· 不绕过付费墙 / 不集成盗版源</text>
    <text x="880" y="162" font-size="12" fill="#455a64">· 不破解 CAPTCHA，风控 → BLOCKED</text>
    <text x="880" y="184" font-size="12" fill="#455a64">· 只用用户自有合法凭证</text>
    <text x="880" y="206" font-size="12" fill="#455a64">· 诚实 UA + robots/Content-Signal</text>
    <text x="880" y="228" font-size="12" fill="#455a64">  （D-014）</text>
    <text x="880" y="250" font-size="12" fill="#455a64">· 保守限速：闭源 1 req/6s + 日配额</text>
    <text x="880" y="272" font-size="12" fill="#455a64">· 凭证 / session / PDF 永不入 git</text>
    <text x="880" y="294" font-size="12" fill="#455a64">· 下载物仅本地个人科研使用</text>
    <text x="880" y="316" font-size="12" fill="#455a64">  不做再分发（AC-0 全程验收）</text>
  </g>

  <!-- 右侧：关键架构决策 -->
  <g>
    <rect x="864" y="342" width="256" height="200" rx="8" fill="#f1f8e9" stroke="#aed581" stroke-width="1.5"/>
    <text x="880" y="368" font-size="14" font-weight="bold" fill="#33691e">关键决策锚点</text>
    <text x="880" y="394" font-size="12" fill="#455a64">D-002 平台 Adapter × VenueSpec</text>
    <text x="880" y="416" font-size="12" fill="#455a64">D-003 双模块共享同一协议</text>
    <text x="880" y="438" font-size="12" fill="#455a64">D-004 六阶段幂等 pipeline</text>
    <text x="880" y="460" font-size="12" fill="#455a64">D-005 元数据走聚合 API 主干</text>
    <text x="880" y="482" font-size="12" fill="#455a64">D-006 人在回路认证 + 状态复用</text>
    <text x="880" y="504" font-size="12" fill="#455a64">D-007 identifier 图 + preprint_of</text>
    <text x="880" y="526" font-size="12" fill="#455a64">D-012 VenueEra 追踪网址漂移</text>
  </g>

  <!-- 右侧：数据流示例 -->
  <g>
    <rect x="864" y="558" width="256" height="138" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
    <text x="880" y="584" font-size="14" font-weight="bold" fill="#0d47a1">典型数据流（pull jfe）</text>
    <text x="880" y="610" font-size="12" fill="#455a64">crossref 枚举卷期/DOI（元数据）</text>
    <text x="880" y="632" font-size="12" fill="#455a64">→ elsevier_sd 解析资产（全文）</text>
    <text x="880" y="654" font-size="12" fill="#455a64">→ AuthProvider 健康门 → 限速下载</text>
    <text x="880" y="676" font-size="12" fill="#455a64">→ 校验落盘 → ingest 合并入库</text>
  </g>

  <!-- 底部注 -->
  <text x="40" y="730" font-size="12" fill="#78909c">依赖规则：上层只可调用下层；adapter 永不自行 sleep/重试（限速与重试统一由 L2 执行，保证可审计）。</text>
  <text x="40" y="750" font-size="12" fill="#78909c">open_access 与 auth_gated 不是两条竖井：同一 SourceAdapter 协议，仅 fetcher backend 与认证声明不同（D-003）。</text>
</svg>
