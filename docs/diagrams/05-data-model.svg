<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="0 0 1160 860" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Paper Crawler · 数据模型 ER 图 · 对应 docs/design/06-data-model.md · 2026-07-20 -->
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="860" fill="#fafbfc"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#263238">数据模型（schema v1）：内部 ULID 主键 + Identifier 图 + preprint_of（D-007）</text>
  <text x="40" y="64" font-size="12" fill="#78909c">对应 design/06-data-model.md · SQLite WAL 起步，PostgreSQL 迁移路径预留 · 2026-07-20</text>

  <!-- venue -->
  <g>
    <rect x="40" y="96" width="210" height="120" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
    <rect x="40" y="96" width="210" height="30" rx="8" fill="#c8e6c9"/>
    <text x="145" y="116" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">venue</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="52" y="144">id PK ('jfe','iclr')</text>
      <text x="52" y="162">kind journal|conf|preprint</text>
      <text x="52" y="180">field[] · tier T1-T3</text>
      <text x="52" y="198">spec_snapshot_json</text>
    </g>
  </g>
  <!-- venue_era -->
  <g>
    <rect x="40" y="252" width="210" height="120" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
    <rect x="40" y="252" width="210" height="30" rx="8" fill="#c8e6c9"/>
    <text x="145" y="272" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">venue_era（D-012）</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="52" y="300">year · label 'NeurIPS 2024'</text>
      <text x="52" y="318">official_site（年年漂移）</text>
      <text x="52" y="336">proceedings_url</text>
      <text x="52" y="354">metadata_source · status</text>
    </g>
  </g>
  <!-- issue -->
  <g>
    <rect x="40" y="408" width="210" height="130" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
    <rect x="40" y="408" width="210" height="30" rx="8" fill="#c8e6c9"/>
    <text x="145" y="428" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">issue</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="52" y="456">volume/number（期刊）</text>
      <text x="52" y="474">year/label（会议届）</text>
      <text x="52" y="492">预印本=虚拟月度桶</text>
      <text x="52" y="510">source · paper_count_claimed</text>
      <text x="52" y="528">UNIQUE(venue,vol,num,label)</text>
    </g>
  </g>
  <!-- paper_issue_link -->
  <g>
    <rect x="300" y="438" width="140" height="64" rx="8" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1.3"/>
    <text x="370" y="464" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#455a64">paper_issue_link</text>
    <text x="370" y="484" font-size="11" text-anchor="middle" fill="#78909c">N ─ M（跨 venue 复现）</text>
  </g>
  <!-- paper (center) -->
  <g>
    <rect x="490" y="300" width="230" height="200" rx="8" fill="#fff8e1" stroke="#ffb300" stroke-width="2"/>
    <rect x="490" y="300" width="230" height="32" rx="8" fill="#ffecb3"/>
    <text x="605" y="322" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#e65100">paper（核心实体）</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="502" y="352">id PK = 内部 ULID</text>
      <text x="502" y="370">（不用外部 id 做主键）</text>
      <text x="502" y="390">title · abstract · year</text>
      <text x="502" y="408">venue_id FK（主发表）</text>
      <text x="502" y="426">meta_json（JEL/track/页码）</text>
      <text x="502" y="446">ingest_state: metadata_only</text>
      <text x="502" y="464">→resolved→fetched→extracted</text>
      <text x="502" y="484">FTS5 索引（title+abstract）</text>
    </g>
  </g>
  <!-- identifier -->
  <g>
    <rect x="800" y="96" width="230" height="130" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
    <rect x="800" y="96" width="230" height="30" rx="8" fill="#bbdefb"/>
    <text x="915" y="116" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">identifier（强合并锚点）</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="812" y="144">PK (scheme, value) 全局唯一</text>
      <text x="812" y="162">scheme: doi|arxiv|ssrn|</text>
      <text x="812" y="180">  openalex|s2|dblp|anthology</text>
      <text x="812" y="198">value '10.1016/...' </text>
      <text x="812" y="216">同 id 再现 → 自动并入该 paper</text>
    </g>
  </g>
  <!-- asset -->
  <g>
    <rect x="800" y="262" width="230" height="150" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5"/>
    <rect x="800" y="262" width="230" height="30" rx="8" fill="#ffcdd2"/>
    <text x="915" y="282" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#b71c1c">asset（获取计划与产物）</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="812" y="310">kind: pdf|si|html|bibtex|source</text>
      <text x="812" y="328">version: v2|camera-ready|published</text>
      <text x="812" y="346">url · auth_needed（resolve 产物）</text>
      <text x="812" y="364">state: planned|fetched|gone|</text>
      <text x="812" y="382">  no_entitlement|failed</text>
      <text x="812" y="400">file_path · bytes · sha256</text>
    </g>
  </g>
  <!-- fulltext -->
  <g>
    <rect x="800" y="448" width="230" height="100" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
    <rect x="800" y="448" width="230" height="30" rx="8" fill="#c8e6c9"/>
    <text x="915" y="468" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1b5e20">fulltext（1─1）</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="812" y="496">extractor + ver（幂等键成分）</text>
      <text x="812" y="514">text_path (.txt|.tei.xml)</text>
      <text x="812" y="532">char_count · lang</text>
    </g>
  </g>
  <!-- paper_relation -->
  <g>
    <rect x="40" y="596" width="250" height="130" rx="8" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
    <rect x="40" y="596" width="250" height="30" rx="8" fill="#e1bee7"/>
    <text x="165" y="616" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#4a148c">paper_relation（D-007）</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="52" y="644">kind: preprint_of | same_as |</text>
      <text x="52" y="662">      candidate_duplicate</text>
      <text x="52" y="680">confidence · evidence_json</text>
      <text x="52" y="698">decided: null待审|merged|rejected</text>
      <text x="52" y="716">物理不删行，可回滚</text>
    </g>
  </g>
  <!-- author / authorship -->
  <g>
    <rect x="330" y="596" width="170" height="100" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="1.3"/>
    <rect x="330" y="596" width="170" height="28" rx="8" fill="#cfd8dc"/>
    <text x="415" y="615" font-size="13" font-weight="bold" text-anchor="middle" fill="#37474f">authorship</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="342" y="642">position · affiliation</text>
      <text x="342" y="660">PK(paper,author,pos)</text>
    </g>
    <rect x="540" y="596" width="170" height="100" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="1.3"/>
    <rect x="540" y="596" width="170" height="28" rx="8" fill="#cfd8dc"/>
    <text x="625" y="615" font-size="13" font-weight="bold" text-anchor="middle" fill="#37474f">author</text>
    <g font-size="11.5" fill="#37474f" font-family="Menlo, monospace">
      <text x="552" y="642">name · orcid</text>
      <text x="552" y="660">meta_json</text>
    </g>
  </g>
  <!-- runtime group -->
  <g>
    <rect x="760" y="596" width="360" height="220" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="776" y="620" font-size="13.5" font-weight="bold" fill="#37474f">运行时实体（design/05 / design/09）</text>
    <rect x="776" y="634" width="150" height="76" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="851" y="654" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#455a64">task</text>
    <text x="851" y="672" font-size="10.8" text-anchor="middle" fill="#607d8b">kind · venue · params</text>
    <text x="851" y="688" font-size="10.8" text-anchor="middle" fill="#607d8b">state 五态 · attempts</text>
    <text x="851" y="704" font-size="10.8" text-anchor="middle" fill="#607d8b">幂等键去重入队</text>
    <rect x="950" y="634" width="150" height="76" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="1025" y="654" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#455a64">fetch_log</text>
    <text x="1025" y="672" font-size="10.8" text-anchor="middle" fill="#607d8b">脱敏 URL · 字节 · 耗时</text>
    <text x="1025" y="688" font-size="10.8" text-anchor="middle" fill="#607d8b">HTTP 状态 · 限速等待</text>
    <text x="1025" y="704" font-size="10.8" text-anchor="middle" fill="#607d8b">合规审计证据</text>
    <rect x="776" y="724" width="150" height="76" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="851" y="744" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#455a64">subscription</text>
    <text x="851" y="762" font-size="10.8" text-anchor="middle" fill="#607d8b">query_json（DSL）</text>
    <text x="851" y="778" font-size="10.8" text-anchor="middle" fill="#607d8b">watermark · guard</text>
    <rect x="950" y="724" width="150" height="76" rx="6" fill="#ffffff" stroke="#b0bec5"/>
    <text x="1025" y="744" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#455a64">subscription_run</text>
    <text x="1025" y="762" font-size="10.8" text-anchor="middle" fill="#607d8b">new/fetched 计数</text>
    <text x="1025" y="778" font-size="10.8" text-anchor="middle" fill="#607d8b">truncated 熔断标记</text>
    <line x1="851" y1="724" x2="851" y2="710" stroke="#90a4ae" stroke-width="1.2"/>
    <line x1="926" y1="762" x2="950" y2="762" stroke="#90a4ae" stroke-width="1.2" marker-end="url(#e)"/>
  </g>

  <!-- ===== 关系线 ===== -->
  <g stroke="#78909c" stroke-width="1.5" fill="none">
    <line x1="145" y1="216" x2="145" y2="252" marker-end="url(#e)"/>
    <line x1="145" y1="372" x2="145" y2="408" marker-end="url(#e)"/>
    <line x1="250" y1="470" x2="300" y2="470" marker-end="url(#e)"/>
    <line x1="440" y1="470" x2="490" y2="450" marker-end="url(#e)"/>
    <path d="M 250 140 C 420 140 520 220 580 300" marker-end="url(#e)"/>
    <line x1="720" y1="360" x2="800" y2="330" marker-end="url(#e)"/>
    <path d="M 720 340 C 760 300 770 220 800 180" marker-end="url(#e)"/>
    <line x1="720" y1="440" x2="800" y2="480" marker-end="url(#e)"/>
    <path d="M 605 500 C 605 550 500 570 460 596" marker-end="url(#e)"/>
    <line x1="500" y1="646" x2="540" y2="646" marker-end="url(#e)"/>
    <path d="M 290 640 C 380 560 440 520 490 480" marker-end="url(#e)"/>
  </g>
  <g font-size="11" fill="#607d8b">
    <text x="152" y="240">1 ─ N</text>
    <text x="152" y="396">1 ─ N（era_id）</text>
    <text x="256" y="462">1─N</text>
    <text x="446" y="442">N─1</text>
    <text x="360" y="126">venue 1 ─ N paper（主发表）</text>
    <text x="726" y="310">1─N</text>
    <text x="740" y="240">1─N</text>
    <text x="726" y="474">1─1</text>
    <text x="530" y="560">1─N</text>
    <text x="504" y="638">N─1</text>
    <text x="330" y="548">from/to 自关联</text>
  </g>

  <!-- 合并规则注 -->
  <rect x="300" y="740" width="420 " height="76" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.3"/>
  <text x="316" y="762" font-size="12.5" font-weight="bold" fill="#0d47a1">合并策略（ingest）</text>
  <text x="316" y="782" font-size="11.5" fill="#455a64">强：identifier 命中 → 自动并入（来源优先级补缺不覆盖）</text>
  <text x="316" y="800" font-size="11.5" fill="#455a64">弱：标题规范化+首作者 → 仅建 candidate，绝不自动合并</text>

  <!-- 底注 -->
  <text x="40" y="845" font-size="12" fill="#78909c">文件布局：data/pdf/{venue}/{year}/{ulid}.pdf · verify 双向对账（DB↔文件）· 预印本与刊发版保留双条 paper + preprint_of 互联（金融/经济 WP 标题常改，激进合并丢信息）。</text>
</svg>
