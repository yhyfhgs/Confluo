  <rect x="0" y="0" width="1440" height="1080" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#1f2937">图 v2-08 · 三层双向匹配：读者 ↔ 论文 · 论文 → 读者 · 研究者 ↔ 研究者</text>
  <text x="30" y="62" font-size="12" fill="#6b7280">对应 docs/plan/v2/06-recommendation-and-matching.md §10–§11 · ①② 默认启用（简报 Q5）· ③ 默认关闭、双方单独同意（CP HC-18）· ⚠ = 设计假设 · 2026-09-27</text>

  <!-- ================= ① 读者 ↔ 论文 ================= -->
  <rect x="20" y="80" width="1400" height="262" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="36" y="104" font-size="14" font-weight="bold" fill="#1e3a8a">① 读者 ↔ 论文：受众适配 + 供给侧约束重排（R0 起，在 Selector 中执行）</text>

  <rect x="40" y="122" width="230" height="92" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="155" y="144" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">读者 u</text>
  <text x="52" y="166" font-size="12" fill="#374151">兴趣树 T_u（长期 / 短期）</text>
  <text x="52" y="184" font-size="12" fill="#374151">多质心 C_u · 每用户 LR 头</text>
  <text x="52" y="202" font-size="12" fill="#374151">显式画像 · 屏蔽 · 频道</text>

  <rect x="40" y="230" width="230" height="96" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="155" y="252" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">论文 x</text>
  <text x="52" y="274" font-size="12" fill="#374151">主题分布 π_x · 嵌入 e_x</text>
  <text x="52" y="292" font-size="12" fill="#374151">作者簇 · venue · 首见时间</text>
  <text x="52" y="310" font-size="12" fill="#374151">读者向量 R_x（R1，≥ k_cf 收藏者）</text>

  <rect x="310" y="122" width="300" height="92" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="460" y="144" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">读者侧价值</text>
  <text x="322" y="168" font-size="12.5" fill="#374151">s(u, x) = Σ V_a · P_u(a | x)</text>
  <text x="322" y="190" font-size="12" fill="#374151">每用户 LR + 校准 + 行为倾向 ρ（§7.6）</text>

  <rect x="310" y="230" width="300" height="96" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="460" y="252" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">论文侧受众适配</text>
  <text x="322" y="276" font-size="12.5" fill="#374151">a(x, u) = cos(R*_x, T_u)</text>
  <text x="322" y="296" font-size="12" fill="#374151">R*_x = R_x（≥ k_cf），否则取 π_x</text>
  <text x="322" y="315" font-size="11" fill="#1e40af">R0 中 γ_a = 0：先验已含主题亲和，避免重复计入</text>

  <rect x="650" y="150" width="270" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="785" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">组合（只作用于非负部分）</text>
  <text x="662" y="200" font-size="12.5" fill="#374151">s′ = OFFSET + (s − OFFSET)</text>
  <text x="662" y="220" font-size="12.5" fill="#374151">       × (1 + γ_a · (a − ā_u))</text>
  <text x="662" y="244" font-size="12" fill="#374151">γ_a = 0.2（R1）⚠</text>
  <text x="662" y="264" font-size="12" fill="#374151">R1：难度适配（太基础 / 太难）</text>
  <text x="662" y="287" font-size="11" fill="#1e40af">净负候选仍一律沉底</text>

  <rect x="960" y="122" width="444" height="204" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="1182" y="146" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">供给侧约束（Selector，§7.7）</text>
  <text x="974" y="170" font-size="12" fill="#374151">同作者簇 ≤ 2 张/批 · 作者衰减 (1−floor)·decay^k + floor</text>
  <text x="974" y="190" font-size="12" fill="#374151">venue ≤ 3 · 预印本频道 ≤ 5 · 单一主题 ≤ 40%</text>
  <text x="974" y="210" font-size="12" fill="#374151">兴趣校准：次要兴趣保底（Steck）</text>
  <text x="974" y="230" font-size="12" fill="#374151">DPP θ = 0.5：相邻不重复</text>
  <text x="974" y="250" font-size="12" fill="#374151">新作者下限位 ≤ 1 张/批 ← 来自 ②</text>
  <text x="974" y="270" font-size="12" fill="#374151">护栏：作者曝光 Gini · 新作者占比 · 覆盖率</text>
  <text x="974" y="302" font-size="11" fill="#1e40af">这是约束重排，而不是互惠打分（RO §2.9）</text>

  <line x1="270" y1="168" x2="307" y2="168" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="270" y1="278" x2="307" y2="278" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="610" y1="168" x2="647" y2="192" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="610" y1="278" x2="647" y2="258" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="920" y1="225" x2="957" y2="225" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#aBlue)"/>

  <!-- ================= ② 论文 → 读者 ================= -->
  <rect x="20" y="358" width="1400" height="370" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="36" y="382" font-size="14" font-weight="bold" fill="#14532d">② 论文 → 读者：反向推送（Percolator 硬命中 + 反向推送规划器，§11.3）</text>

  <rect x="40" y="400" width="110" height="312" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="95" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">新论文</text>
  <text x="95" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">入库</text>
  <text x="95" y="580" font-size="12" text-anchor="middle" fill="#374151">日新增</text>
  <text x="95" y="598" font-size="12" text-anchor="middle" fill="#374151">1–3 万篇</text>
  <text x="95" y="616" font-size="11" text-anchor="middle" fill="#166534">（简报 B-04）</text>

  <rect x="172" y="400" width="240" height="92" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="184" y="422" font-size="13" font-weight="bold" fill="#14532d">频道 AST 硬命中</text>
  <text x="184" y="442" font-size="12" fill="#374151">04 Percolator 倒排匹配</text>
  <text x="184" y="460" font-size="12" fill="#374151">直接写 FeedInbox</text>
  <text x="184" y="478" font-size="12" fill="#374151">不占软预算，受频道护栏约束</text>

  <rect x="172" y="508" width="240" height="92" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="184" y="530" font-size="13" font-weight="bold" fill="#14532d">节点倒排</text>
  <text x="184" y="550" font-size="12" fill="#374151">TopicNode → 高亲和用户</text>
  <text x="184" y="568" font-size="12" fill="#374151">θ_L(t) ≥ τ，或显式关注</text>
  <text x="184" y="586" font-size="12" fill="#374151">（TSRG 的反向路由）</text>

  <rect x="172" y="616" width="240" height="96" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="184" y="638" font-size="13" font-weight="bold" fill="#14532d">批量质心点积</text>
  <text x="184" y="658" font-size="12" fill="#374151">E_new · C_users^T，每篇取前 200</text>
  <text x="184" y="676" font-size="12" fill="#374151">1 万 × 5 质心 × 2.5 万篇 × 256 维</text>
  <text x="184" y="694" font-size="12" fill="#374151">≈ 3.2e11 次乘加（SR §2.10.2）</text>

  <line x1="150" y1="446" x2="169" y2="446" stroke="#15803d" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <line x1="150" y1="554" x2="169" y2="554" stroke="#15803d" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <line x1="150" y1="664" x2="169" y2="664" stroke="#15803d" stroke-width="1.6" marker-end="url(#aGreen)"/>

  <!-- 流网络 -->
  <text x="446" y="418" font-size="13" font-weight="bold" fill="#14532d">资格集下限单位 → 最小费用流（其余边贪心）</text>
  <text x="446" y="437" font-size="11" fill="#166534">边权 w_ux = Σ V·P × p_show(u)；w &lt; τ_min 的边丢弃 ⚠；非个性化用户不参与</text>

  <line x1="412" y1="446" x2="462" y2="533" stroke="#15803d" stroke-width="1.4" marker-end="url(#aGreen)"/>
  <line x1="412" y1="554" x2="458" y2="547" stroke="#15803d" stroke-width="1.4" marker-end="url(#aGreen)"/>
  <line x1="412" y1="664" x2="462" y2="560" stroke="#15803d" stroke-width="1.4" marker-end="url(#aGreen)"/>

  <!-- s → x -->
  <line x1="498" y1="537" x2="584" y2="492" stroke="#64748b" stroke-width="1.3" marker-end="url(#aGray)"/>
  <line x1="500" y1="545" x2="581" y2="545" stroke="#64748b" stroke-width="1.3" marker-end="url(#aGray)"/>
  <line x1="498" y1="553" x2="584" y2="598" stroke="#64748b" stroke-width="1.3" marker-end="url(#aGray)"/>
  <text x="468" y="497" font-size="10.5" fill="#475569">need_x · −M</text>
  <!-- x → u -->
  <line x1="617" y1="482" x2="733" y2="471" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="616" y1="490" x2="735" y2="516" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="616" y1="540" x2="735" y2="524" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="616" y1="550" x2="735" y2="566" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="616" y1="600" x2="735" y2="574" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="617" y1="608" x2="733" y2="619" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <text x="648" y="462" font-size="10.5" fill="#475569">1 · −w_ux</text>
  <!-- u → t -->
  <line x1="766" y1="472" x2="872" y2="535" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="766" y1="522" x2="869" y2="541" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
  <line x1="766" y1="569" x2="869" y2="550" stroke="#64748b" stroke-width="1.2" marker-end="url(#aGray)"/>
