  <text x="812" y="500" font-size="10.5" fill="#475569">≤ 2</text>
  <!-- 旁路 s → t -->
  <path d="M 480 565 L 480 650 L 890 650 L 890 568" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="685" y="664" font-size="11" text-anchor="middle" fill="#475569">旁路 s→t（成本 0）</text>

  <circle cx="480" cy="545" r="20" fill="#166534" stroke="#14532d" stroke-width="1.5"/>
  <text x="480" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">s</text>
  <circle cx="600" cy="485" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="490" font-size="13" text-anchor="middle" fill="#14532d">x₁</text>
  <circle cx="600" cy="545" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="550" font-size="13" text-anchor="middle" fill="#14532d">x₂</text>
  <circle cx="600" cy="605" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="610" font-size="13" text-anchor="middle" fill="#14532d">x₃</text>
  <circle cx="750" cy="470" r="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="750" y="475" font-size="12.5" text-anchor="middle" fill="#155e75">u₁</text>
  <circle cx="750" cy="520" r="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="750" y="525" font-size="12.5" text-anchor="middle" fill="#155e75">u₂</text>
  <circle cx="750" cy="570" r="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="750" y="575" font-size="12.5" text-anchor="middle" fill="#155e75">u₃</text>
  <circle cx="750" cy="620" r="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="750" y="625" font-size="12.5" text-anchor="middle" fill="#155e75">u₄</text>
  <circle cx="890" cy="545" r="20" fill="#166534" stroke="#14532d" stroke-width="1.5"/>
  <text x="890" y="550" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">t</text>

  <text x="446" y="684" font-size="11" fill="#374151">s→x：容量 need_x（剩余下限，按 p_show 过量），成本 −M（软下限）</text>
  <text x="446" y="700" font-size="11" fill="#374151">x→u：容量 1、成本 −⌊1000·w_ux⌋；u→t：容量 min(预算余量, 2 − 已有下限)</text>
  <text x="446" y="716" font-size="11" fill="#374151">旁路吸收满足不了的需求；求解后其余边按价值贪心（10⁴–10⁵ 条弧，秒级，估算）</text>

  <rect x="950" y="400" width="454" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1177" y="424" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">下限资格与预算（§10.4–§10.5）</text>
  <text x="964" y="446" font-size="12" fill="#374151">资格：新作者或小领域 · 通过质量闸 · 合格受众 ≥ f_x / p_show</text>
  <text x="964" y="466" font-size="12" fill="#374151">f_x = 20 次确认可见曝光 / 7 天 ⚠ · 每作者簇 30 天 ≤ 1 篇</text>
  <text x="964" y="486" font-size="12" fill="#374151">全局下限预算 ≤ 5% 期望 Deck 曝光（估算）：</text>
  <text x="964" y="506" font-size="12" fill="#374151">1,000 活跃 × 0.7 × 25 ≈ 1.75 万次/日 → ≈ 875 次 ≈ 44 篇</text>
  <text x="964" y="530" font-size="11.5" fill="#b45309">日新增 1–3 万篇 ⇒ 下限只覆盖资格集合（R2-41；§24 A1）</text>

  <rect x="950" y="562" width="454" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1177" y="586" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">输出：FeedInbox（14 天过期；下限条目随期限）</text>
  <text x="964" y="608" font-size="12" fill="#374151">push_reason ∈ {channel_hit, node_match, centroid_match, floor}</text>
  <text x="964" y="628" font-size="12" fill="#374151">每用户软推送预算 b_u = 2B = 50 · 每篇上限 U_x = 300 ⚠</text>
  <text x="964" y="648" font-size="12" fill="#374151">→ Deck：S1 频道源 · S7 分级曝光池 · 下限条目占探索槽</text>
  <text x="964" y="668" font-size="12" fill="#374151">默认贪心（下限优先，再按价值）；资格集用最小费用流</text>
  <text x="964" y="690" font-size="11.5" fill="#166534">站外推送默认关闭；开启后每日 ≤1 封 digest · 免打扰 · 无角标</text>

  <line x1="912" y1="545" x2="947" y2="610" stroke="#15803d" stroke-width="1.6" marker-end="url(#aGreen)"/>
  <line x1="950" y1="470" x2="916" y2="470" stroke="#15803d" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#aGreen)"/>
  <text x="910" y="462" font-size="10.5" fill="#166534">need_x</text>

  <!-- ================= ③ 研究者 ↔ 研究者 ================= -->
  <rect x="20" y="744" width="1400" height="320" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="36" y="768" font-size="14" font-weight="bold" fill="#7c2d12">③ 研究者 ↔ 研究者：互惠匹配（实验功能 · 默认关闭 · 双方单独同意 · 可随时撤回；§11.4）</text>

  <rect x="40" y="786" width="230" height="70" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="52" y="810" font-size="12.5" font-weight="bold" fill="#7c2d12">u：单独同意（CP HC-18）</text>
  <text x="52" y="830" font-size="11" fill="#374151">≥18 岁 ⚠ · 实名锚定（ORCID / 机构邮箱）</text>
  <text x="52" y="847" font-size="11" fill="#374151">同意页不与用户协议捆绑</text>

  <rect x="40" y="868" width="230" height="70" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="52" y="892" font-size="12.5" font-weight="bold" fill="#7c2d12">v：单独同意</text>
  <text x="52" y="912" font-size="11" fill="#374151">撤回 → 1 分钟内移出匹配池</text>
  <text x="52" y="929" font-size="11" fill="#374151">24 h 内删除画像与建议；记录留审计</text>

  <rect x="40" y="952" width="230" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="155" y="976" font-size="13" font-weight="bold" text-anchor="middle" fill="#b91c1c">隐私墙 ✕</text>
  <text x="52" y="998" font-size="11.5" fill="#7f1d1d">滑动 · 收藏 · 评分 · 笔记</text>
  <text x="52" y="1016" font-size="11.5" fill="#7f1d1d">阅读轨迹 · 全文 · 打开全文</text>
  <text x="52" y="1036" font-size="11.5" font-weight="bold" fill="#b91c1c">私有行为永不进入 ③</text>

  <rect x="300" y="786" width="260" height="152" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
  <text x="430" y="810" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">公开研究画像（唯一输入）</text>
  <text x="312" y="834" font-size="12" fill="#374151">自选兴趣标签（受控词表）</text>
  <text x="312" y="854" font-size="12" fill="#374151">本人作品（ORCID 认领）</text>
  <text x="312" y="874" font-size="12" fill="#374151">意图：合作 / 审稿交流 / 读书会</text>
  <text x="312" y="894" font-size="12" fill="#374151">自愿公开的列表</text>
