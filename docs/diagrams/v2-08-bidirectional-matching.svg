  <rect x="590" y="786" width="320" height="110" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
  <text x="750" y="810" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">方向分 s(u→v) ∈ (0, 1]</text>
  <text x="602" y="834" font-size="12" fill="#374151">0.5 · 兴趣标签重叠（subfield 向量余弦）</text>
  <text x="602" y="854" font-size="12" fill="#374151">+ 0.3 · v 的作品与 u 兴趣的相关</text>
  <text x="602" y="874" font-size="12" fill="#374151">+ 0.2 · 意图相容；× 匹配活跃度（仅匹配页内动作）⚠</text>

  <rect x="590" y="910" width="320" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="750" y="934" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">互惠分（RECON 调和平均）</text>
  <text x="750" y="958" font-size="13" text-anchor="middle" fill="#374151">r = 2 / (1/s(u→v) + 1/s(v→u))</text>
  <text x="750" y="978" font-size="11" text-anchor="middle" fill="#9a3412">任一方兴趣低 → r 低</text>

  <rect x="940" y="786" width="464" height="110" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1172" y="810" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">容量与公平（每周，⚠）</text>
  <text x="952" y="834" font-size="12" fill="#374151">每人每周建议度 ≤ 3（对称下发：收到 = 被推荐），防拥塞</text>
  <text x="952" y="854" font-size="12" fill="#374151">有合格候选者每 2 周至少 1 次曝光（公平）</text>
  <text x="952" y="874" font-size="12" fill="#374151">带度上限的 b-matching：贪心 + 公平补位</text>

