# AuthProvider profiles 样例（有状态凭证的 provider 定义；见 docs/design/auth-framework.md §3.4）。
#
# 用法：复制到 <config-home>/auth/profiles.toml 后按机构填真实 URL/ref 名。
#
# **无任何密钥明文**（AC-0.3）——本文件只放 provider 结构 + 引用名：
#   - 简单字符串密钥（api_key/token/insttoken）走 config.toml [auth.*] 槽或 keyring（key_ref 指向条目名）；
#   - 有状态凭证（cookie jar / storage_state）走 AES-GCM 加密的 auth/state/<state_ref>.enc（值不在此）。
# 四 kind 各一样例（api_key / cookie_session / sso_flow / ezproxy）；URL/ref 均为占位。

schema_version = 1

# -- api_key：Elsevier（默认 profile，无 @ 后缀）--------------------------------------------
[providers.elsevier]
kind = "api_key"
platform = "elsevier_sd"
key_ref = "elsevier_apikey"                # keyring 条目名（密钥值不在此文件）
insttoken_ref = "elsevier_insttoken"       # 可选：机构 token 条目名
quota_probe = "https://api.elsevier.com/content/article/doi/PLACEHOLDER_DOI"

# -- cookie_session：OUP（具名 profile，@ 后缀区分多机构/多账号）-----------------------------
[providers."oup@campus"]
kind = "cookie_session"
platform = "oup_silverchair"
login_url = "https://academic.oup.com/PLACEHOLDER_JOURNAL"      # 首登打开页
probe_url = "https://academic.oup.com/my-account"              # 会话有效性探测页
state_ref = "oup_campus_state"             # auth/state/<ref>.enc（加密 storage_state；值不在此）
est_ttl_hours = 24                         # 经验 TTL（主动提前 health_check）

# -- sso_flow：OUP Shibboleth/OpenAthens ----------------------------------------------------
[providers."oup@shib"]
kind = "sso_flow"
platform = "oup_silverchair"
inst_login_url = "https://academic.oup.com/PLACEHOLDER/InstitutionalLogin"
wayf_hint = "My University"                # WAYF 机构选择关键词（首登辅助，非自动化 MFA）
probe_url = "https://academic.oup.com/my-account"
state_ref = "oup_shib_state"
est_ttl_hours = 8

# -- ezproxy：URL 重写 + proxy cookie -------------------------------------------------------
[providers."elsevier@ezproxy"]
kind = "ezproxy"
platform = "elsevier_sd"
proxy_base = "https://login.PLACEHOLDER-univ.edu/login?url="   # EZProxy 登录入口
rewrite_suffix = ".login-PLACEHOLDER-univ-edu.ezproxy"        # host 重写后缀（泛化规则）
state_ref = "ezproxy_myuniv_state"         # proxy cookie（加密）
est_ttl_hours = 12
