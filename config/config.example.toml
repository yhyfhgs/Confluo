# paper-crawler 配置样例（config-home config.toml 全键注释模板）。
#
# 用法：复制到 config-home 后填真实值——
#   $PAPER_CRAWLER_HOME/config.toml   或   ~/.paper-crawler/config.toml（仓库外）。
#
# **本文件所有值为占位/空样例，绝不含真实凭证**（AC-0.3 不变式；CI 断言 config/** 无凭证形态）。
#
# 分层加载优先级（高→低，逐键覆盖；见 docs/design/10-config-layout.md §3）：
#   1. env（PAPER_CRAWLER_*）                          ← 最高（CI/临时会话不落盘凭证）
#   2. 项目级 ./paper-crawler.toml（**仅非敏感键**）   ← 本机工作区层（路径/限速/venue 目录）
#   3. 本文件（config-home config.toml）               ← 家目录，仓库外，可含敏感槽
#   4. 内置默认                                        ← 兜底
#
# 敏感边界（AC-0.3）：凭证只存 config-home（仓库外）或 env，**绝不入仓库工作树**。项目级
# ./paper-crawler.toml 出现敏感键形态（api_key/token/insttoken/password/secret/…）→ 启动护栏
# CrawlerError(CONFIG) 拒启动（挪至家目录/env）。自查生效值 + 来源层：`crawler config show`。

# == 身份（D-014 UA 的 mailto: 段来源；非凭证，可入项目级）=====================================
[identity]
email = "you@example.edu"          # UA `mailto:`；缺省则 UA 省略该段（config show 部分脱敏）

# == 路径（非凭证，可入项目级 ./paper-crawler.toml）==========================================
[paths]
# data_dir = "/abs/path/to/data"   # 缺省 = <config-home>/data；相对路径挂在 config-home 下
# venues_dirs = ["venues"]         # 缺省 = 检测 ./venues 与 <config-home>/venues（保序，后覆前）

# == 限速 / 重试缩放（非凭证，可入项目级）====================================================
[rate]
scale = 1.0                        # <1 更慢更保守；与站点声明取 min（只会更严，不放宽）

[retry]
scale = 1.0                        # RETRY_TABLE 退避秒数缩放

# == OpenAlex 补充源预算（非凭证，可入项目级）================================================
[openalex]
daily_budget_usd = 0.50            # 每日 credit 预算上限（美元）；命中即熔断当日 enrich

# ============================================================================================
# 认证凭证槽 [auth.*]（**只放 config-home，仓库外**；env PAPER_CRAWLER_* 覆盖）
# 简单字符串密钥（D-023 ①类，auth-framework §3.4）——不触 AES-GCM/keyring。
# 空白/缺省 = 未配置（空白串归一为 None）；**不入日志/报告**（obslog redact 覆盖）。
# 有状态凭证（cookie/storage_state，CookieSession/SSO）走 auth/profiles.toml（见 profiles.example.toml）。
# ============================================================================================

[auth.openreview]
token = ""        # OpenReview access token（Cookie 通道）；env PAPER_CRAWLER_OPENREVIEW_TOKEN

[auth.openalex]
api_key = ""      # OpenAlex API key（可选，提升每日 credit 额度）；env PAPER_CRAWLER_OPENALEX_API_KEY

[auth.s2]
api_key = ""      # Semantic Scholar API key（enrich 生产必需）；env PAPER_CRAWLER_S2_API_KEY

[auth.elsevier]
api_key = ""      # Elsevier X-ELS-APIKey；env PAPER_CRAWLER_ELSEVIER_API_KEY
insttoken = ""    # 可选 机构 X-ELS-Insttoken；env PAPER_CRAWLER_ELSEVIER_INSTTOKEN

[auth.wiley]
token = ""        # Wiley-TDM-Client-Token（UUID 形态）；env PAPER_CRAWLER_WILEY_TDM_TOKEN

# == AuthProvider 运行时选择（有状态 provider 见 profiles.example.toml）=======================
[auth]
# active_profile = { oup_silverchair = "oup@campus", elsevier_sd = "elsevier" }
# CLI `--profile` 可临时覆盖（在校用直连 / 离校切 elsevier@ezproxy，无需改 VenueSpec）。

# -- auth-framework §8 pipeline 运行时 knobs（非敏感，可入项目级；env PAPER_CRAWLER_* 覆盖）--
# 占位=默认值；仅 auth_gated venue 生效（open_access/aggregator 不受约束）。
# daily_cap = 200          # §8.3 日配额（auth 平台域当日 fetch 尝试篇次上限）；env _AUTH_DAILY_CAP
# health_interval = 20     # §8.2 每 N 篇强制 healthcheck（过期检测，防 401 轰炸）；env _AUTH_HEALTH_INTERVAL
# health_max_age_s = 900   # §8.2 健康门老化上限（秒，15min）；env _AUTH_HEALTH_MAX_AGE_S
# work_hours = "8-23"      # §8.6 本地工作时段窗（起含-止不含）；"0-24" 关闭全天放行；env _AUTH_WORK_HOURS

# == OA-fallback（no_entitlement 的 unpaywall 兜底 direct 取回；非凭证）========================
[oa_fallback]
# rate_rpm = 30            # §8.1 OA 第三方 host 保守限速（req/min，=1 req/2s）；env PAPER_CRAWLER_OA_FALLBACK_RATE_RPM

# == browser-fetch 横切件（design/11 §7.5；非凭证，可入项目级）================================
# 浏览器上下文取回单篇全文的 opt-in 通道。**默认全关**（D-029：非默认、非批量、用户显式发起）；
# 打开后还需每次显式 `crawler grab --doi <X> --browser` 才走该通道（三级门全开才生效）。
# 红线（AC-0.2）：遇风控/CAPTCHA **只分类不求解**——立即 BLOCKED + 域冷却 24h，由你本人在
# 自己的浏览器里完成站点验证后 `crawler resume --all`；系统绝不代替你"过验证"。
# 依赖：pip install paper-crawler[auth-browser] && playwright install chromium
[browserfetch]
# enabled = false          # 全局开关；env PAPER_CRAWLER_BROWSER_FETCH_ENABLED
# daily_cap = 50           # 每 venue×域 每日 fetch 尝试篇次上限（成败均计）；env _BROWSER_DAILY_CAP
# rate_rpm = 10            # 域级限速（req/min，=1 req/6s；并发恒 1）；env _BROWSER_RATE_RPM
# jitter_s = [2, 5]        # 每次请求前的额外抖动区间（秒）；env _BROWSER_JITTER_S（"2,5"）
