# subscriptions/presets/corporate-finance.yaml —— 预置 topic 包（模板，非活订阅；见 subscriptions/README.md）
#
# 取向：宽召回。公司金融覆盖资本结构、并购、股利政策、公司治理等多个子话题，
#   arXiv 没有专属类目兜底（只能靠 q-fin.GN/econ.GN 两个通用类目广撒网），必须
#   靠本地关键词族收敛，源头查询不宜收太紧。
# 改造建议：若只关心某一子话题（如仅并购），把 title_regex_any 收窄到单一词族
#   （如只留 "merger"/"acquisition"），并去掉 econ.GN 类目减少无关经济学产出。
#
# ⚠ T8 审查修复（2026-07-26）：补 IPO/leverage/repurchase|buyback/takeover/
#   executive compensation 五个该子领域公认词族（原覆盖面偏窄，只有资本结构/
#   并购/股利/治理四条）；exclude_regex 的 survey 锚定为精确短语，防误杀。
name: corporate-finance
sources:
  arxiv:
    categories: [q-fin.GN, econ.GN]   # 官方分类（核对：docs/research/site-survey/arxiv.md 分类体系表；无专属公司金融类目，取通用兜底）
    query: >
      (ti:"capital structure" OR abs:"merger" OR abs:"acquisition"
       OR abs:"payout policy" OR abs:"corporate governance")
      AND NOT ti:"survey"
  ssrn:
    networks: [FEN]                          # SSRN 子网（FEN=Financial Economics Network）
    ejournals: ["Corporate Finance eJournal"]  # ⚠ 名称实现期核验（核对：docs/research/site-survey/econ-fin-preprints.md「FEN…Corporate Finance」）
  nber:
    # NBER Corporate Finance program。证据等级 [LIVE]：docs/research/site-survey/nber.md
    # 明确记录对 newcf.xml 的独立 HTTP 实测（200，3 item）——强于 asset-pricing.yaml
    # 的 AP=[DOC]（该文件同位注释有说明）。
    programs: [CF]
filters:
  title_regex_any:
    - "capital structure"
    - "merger"
    - "acquisition"
    - "payout polic"
    - "dividend"
    - "corporate governance"
    - "\\bIPO\\b|initial public offering"   # 新增
    - "leverage"                            # 新增
    - "repurchase|buyback"                  # 新增
    - "takeover"                            # 新增
    - "executive compensation"              # 新增
  exclude_regex: ["\\ba survey\\b|: a survey|\\bsurvey of\\b"]   # survey 锚定，防误杀含 "survey" 字样的非综述论文
  min_year: 2020
actions:
  ingest: metadata
  auto_fetch_limit: 12
guard:
  max_new_per_run: 150        # 宽召回取向：多子话题汇入，阈值相应调高
  dedupe_against_library: true
schedule_hint: weekly
