# subscriptions/presets/optimization-ml.yaml —— 预置 topic 包（模板，非活订阅；见 subscriptions/README.md）
#
# 取向：宽召回。机器学习优化方法横跨几乎全部 ML 子领域（深度学习训练、强化
#   学习、贝叶斯方法都会用到自己的优化器变体），没有单一专属类目能兜住全部
#   产出，源头需要广撒网靠本地关键词收敛。
# 改造建议：若想精确化，把 title_regex_any 收紧到具体方法族（如只留
#   "second-order"/"Newton" 一族），或加 exclude_regex 排除纯应用型论文
#   （如排除 "case study"）。
#
# ⚠ T8 审查修复（2026-07-26）：①裸词干 "optimiz" 太宽（会命中运筹学等无关领域
#   的"optimization"标题），改为要求前面紧跟 stochastic/convex/non-convex 等
#   ML 语境锚点——比直接删掉更稳妥，删掉会漏判 "Adam: A Method for Stochastic
#   Optimization" 这类该领域最重要的论文（实测验证）；②"convergence rate"过窄
#   漏掉"On the Convergence of X"泛型标题，放宽为带上下文式；③query 的
#   "stochastic gradient" 分支原无 title 对应式（死子句）；④补 \bSGD\b/mirror
#   descent/proximal 三个该子领域公认词族；⑤openalex concept 从泛泛的
#   "mathematical optimization" 换成更贴 ML 的 "stochastic gradient descent"
#   （该段已于 R2b 整体删除，见下条）。
# ⚠ R2b 修复（2026-07-28，P0-4）：删原 openalex 段（concepts=[stochastic gradient
#   descent, convex optimization] + from_source_types=[preprint]）——openalex
#   capabilities 空集（enrich-only），watch 侧无 DISCOVER/ENUMERATE，跑必抛
#   CapabilityNotSupported。见 src/paper_crawler/subs/model.py::SOURCE_FIELDS。
name: optimization-ml
sources:
  arxiv:
    categories: [cs.LG, stat.ML, cs.AI, cs.NE]   # 官方分类（核对：docs/research/site-survey/arxiv.md 分类体系表）
    query: >
      (ti:"convex optimization" OR abs:"stochastic gradient" OR abs:"convergence rate"
       OR abs:"adaptive optimizer")
      AND NOT ti:"survey"
filters:
  title_regex_any:
    - "(stochastic|convex|non-?convex) optimiz"   # 原裸 "optimiz" 改为 ML 语境锚定式（T8 修复）
    - "gradient descent"
    - "stochastic gradient"                       # 对应 query 分支（T8 修复：原缺失）
    - "convergence (rate|analysis|guarantee|of|proof)"   # 原 "convergence rate" 过窄放宽（T8 修复）
    - "adaptive (optimizer|method)"
    - "second-order method"
    - "\\bSGD\\b"           # 新增
    - "mirror descent"      # 新增
    - "proximal"            # 新增
  exclude_regex: ["\\ba survey\\b|: a survey|\\bsurvey of\\b"]   # survey 锚定，防误杀含 "survey" 字样的非综述论文
  min_year: 2022
actions:
  ingest: metadata
  auto_fetch_limit: 15
guard:
  max_new_per_run: 200        # 宽召回取向：跨子领域汇入量大，阈值相应调高
  dedupe_against_library: true
schedule_hint: daily
