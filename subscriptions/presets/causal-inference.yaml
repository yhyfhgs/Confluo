# subscriptions/presets/causal-inference.yaml —— 预置 topic 包（模板，非活订阅；见 subscriptions/README.md）
#
# 取向：宽召回。因果推断是横跨统计、计量经济、机器学习乃至流行病学的方法论，
#   同一批核心概念（工具变量、倍差法、断点回归）在不同学科用不同的写法出现——
#   过早收紧类目或关键词会系统性漏掉某一学科的产出。
# 改造建议：若只关心某一应用领域（如仅经济学），去掉 cs.LG/stat.ML 类目，只留
#   econ.EM。
#
# ⚠ R2b 修复（2026-07-28，P0-4）：删原 openalex 段（concepts=[causal inference] +
#   from_source_types=[preprint]）与 s2 段（fields_of_study=[Economics, Computer
#   Science]、venues=[Journal of Causal Inference, Journal of Econometrics, JASA,
#   Biometrika, Econometrica, American Economic Review]、query="causal inference"）。
#   两源 capabilities 均为空集（enrich-only，只走 `crawler enrich`），watch 侧无
#   DISCOVER/ENUMERATE——照原样跑必抛 CapabilityNotSupported。跨学科覆盖现由 arxiv
#   的四个类目（stat.ME/stat.ML/econ.EM/cs.LG）+ 本地词族承担；期刊侧覆盖如有需要，
#   可自行加 crossref 段按 ISSN 订阅（那是真跑得动的期刊 watch 通道）。
#   见 src/paper_crawler/subs/model.py::SOURCE_FIELDS。
#
# ⚠ T8 审查修复（2026-07-26）：query 与 title 双侧补 regression discontinuity/
#   synthetic control/double machine learning 三个该领域公认方法族（原缺失，
#   实测 6/6 经典标题被漏判或误杀）；difference-in-differences 收紧为死板全词，
#   改为容忍连字符/空格与复数变体的宽松式；补 \bDiD\b 缩写。
name: causal-inference
sources:
  arxiv:
    categories: [stat.ME, stat.ML, econ.EM, cs.LG]   # 官方分类（核对：docs/research/site-survey/arxiv.md 分类体系表）
    query: >
      (ti:"causal inference" OR abs:"instrumental variable" OR abs:"treatment effect"
       OR abs:"difference-in-differences" OR abs:"propensity score"
       OR abs:"regression discontinuity" OR abs:"synthetic control")
      AND NOT ti:"survey"
filters:
  title_regex_any:
    - "causal"
    - "treatment effect"
    - "instrumental variable"
    - "difference\\w*[- ]in[- ]difference"   # 原死板全词漏掉连字符/复数变体，改宽（T8 修复）
    - "\\bDiD\\b"                            # 新增：DiD 缩写
    - "propensity score"
    - "regression discontinuity"             # 新增（T8 修复：query 已有，title 端原缺失）
    - "synthetic control"                    # 新增（同上）
    - "double.{0,20}machine learning"        # 新增：容忍 "Double/Debiased Machine Learning" 原始表述
  exclude_regex: ["\\ba survey\\b|: a survey|\\bsurvey of\\b"]   # survey 锚定，防误杀含 "survey data/experiment" 字样的方法论文
  min_year: 2020
actions:
  ingest: metadata
  auto_fetch_limit: 15
guard:
  max_new_per_run: 180        # 宽召回取向：多学科汇入，阈值相应调高
  dedupe_against_library: true
schedule_hint: weekly
