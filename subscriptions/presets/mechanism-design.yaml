# subscriptions/presets/mechanism-design.yaml —— 预置 topic 包（模板，非活订阅；见 subscriptions/README.md）
#
# 取向：高精确。机制设计是 CS 博弈论（cs.GT）与经济理论（econ.TH）交界处的窄
#   分支，auction/matching 词族专指性强（不太会与其他 CS/经济学分支混淆），适合
#   直接收紧。
# 改造建议：若想扩召回覆盖应用型多智能体博弈工作，加回 cs.MA/cs.AI 类目并放宽
#   query 的布尔约束（去掉 NOT ti:"survey"）。
#
# ⚠ T8 审查修复（2026-07-26）：补 strategy-proof/deferred acceptance/school
#   choice/kidney exchange 四个该子领域公认经典词族（稳定匹配理论一脉：
#   Gale-Shapley/Roth-Sönmez-Ünver/Abdulkadiroğlu-Sönmez）；exclude_regex 的
#   survey 锚定为精确短语，防误杀。
# ⚠ R2b 修复（2026-07-28，P0-4）：删原 openalex 段（concepts=[mechanism design,
#   auction theory] + from_source_types=[preprint]）——openalex capabilities 空集
#   （enrich-only），watch 侧无 DISCOVER/ENUMERATE，跑必抛 CapabilityNotSupported。
#   见 src/paper_crawler/subs/model.py::SOURCE_FIELDS。
name: mechanism-design
sources:
  arxiv:
    categories: [cs.GT, econ.TH]   # 官方分类（核对：docs/research/site-survey/arxiv.md 分类体系表）
    query: >
      (ti:"mechanism design" OR ti:"auction" OR abs:"matching market"
       OR abs:"incentive compatib" OR abs:"truthful mechanism")
      AND NOT ti:"survey"
filters:
  title_regex_any:
    - "mechanism design"
    - "auction"
    - "matching market"
    - "stable matching"
    - "incentive compat"
    - "truthful"
    - "\\bVCG\\b"
    - "strategy-?proof"        # 新增（容忍 "strategyproof"/"strategy-proof" 两种拼法）
    - "deferred acceptance"    # 新增
    - "school choice"          # 新增
    - "kidney exchange"        # 新增
  exclude_regex: ["\\ba survey\\b|: a survey|\\bsurvey of\\b"]   # survey 锚定，防误杀含 "survey" 字样的非综述论文
  min_year: 2021
actions:
  ingest: metadata
  auto_fetch_limit: 8
guard:
  max_new_per_run: 60         # 高精确取向：窄分支月产出有限，阈值相应调低
  dedupe_against_library: true
schedule_hint: weekly
