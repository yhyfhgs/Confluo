# subscriptions/presets/asset-pricing.yaml —— 预置 topic 包（模板，非活订阅；见 subscriptions/README.md）
#
# 取向：高精确。资产定价是金融学里边界清楚的子领域，SSRN FEN 网络下有专属
#   eJournal、NBER 有专属 program（AP）、arXiv 有专属类目（q-fin.PR/PM/ST/MF）——
#   三源都能精确下推，没必要靠宽召回兜底噪声。
# 改造建议：若想扩召回，去掉 ssrn.ejournals 只留 networks: [FEN]，或去掉
#   title_regex_any 只靠源头类目/分类过滤。
#
# sources 结构取自 docs/design/09-search-filter.md §2 示例二（asset-pricing-wp）范式。
# ⚠ T8 审查修复（2026-07-26）：①"asset pricing"死板全词改宽为词干 "asset pric"；
#   ②补 equity premium/anomal 两个该领域公认经典词族（Mehra-Prescott 之谜、
#   Fama-French 异象一脉）；③原缺 exclude_regex，补 survey 锚定；④加 q-fin.MF
#   类目；⑤下方 nber.programs 注释补证据等级标注（对照 corporate-finance.yaml
#   的 CF=[LIVE] 更强证据，AP 目前只到 [DOC] 级）。
name: asset-pricing
sources:
  ssrn:
    networks: [FEN]                    # SSRN 子网（FEN=Financial Economics Network）
    ejournals: ["Asset Pricing eJournal", "Capital Markets eJournal"]  # ⚠ 名称实现期核验
  arxiv:
    categories: [q-fin.PR, q-fin.PM, q-fin.ST, q-fin.MF]   # 官方分类（核对：docs/research/site-survey/arxiv.md 分类体系表）
  nber:
    # NBER Asset Pricing program。AP=newap 映射证据等级 [LIVE 2026-07-27]（原 [DOC]，见
    # docs/research/site-survey/{nber,econ-fin-preprints}.md 命名列表）——T19 在线验收批
    # 隔离订阅 nber-ap-isolation 对 https://back.nber.org/rss/newap.xml 独立 HTTP 实测：
    # 200，正常解析出 4 条候选（docs/testing/records/2026-07-27-ac7-acceptance.md §2.7(a)）。
    # 现与 corporate-finance.yaml 的 CF=[LIVE]（nber.md 记录 newcf.xml 实测 200）同证据等级。
    programs: [AP]
filters:
  title_regex_any:
    - "asset pric"          # 原 "asset pricing" 死板全词改宽（T8 修复）
    - "cross-section"
    - "risk premi"
    - "factor model"
    - "expected return"
    - "equity premium"      # 新增（Mehra-Prescott 之谜一脉经典词族）
    - "anomal"              # 新增（Fama-French 异象文献一脉）
  exclude_regex: ["\\ba survey\\b|: a survey|\\bsurvey of\\b"]   # 新增：原无 exclude_regex（T8 修复）
  min_year: 2022
actions: {ingest: metadata, auto_fetch_limit: 10}
guard:
  max_new_per_run: 120
  dedupe_against_library: true
schedule_hint: weekly
